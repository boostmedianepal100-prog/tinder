<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartSync - Romantic Dating Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #1a0b16 0%, #2d122d 50%, #170923 100%);
      color: #fff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .heart-glow {
      filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.6));
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-28">

  <!-- SIGN UP / LOGIN MODAL -->
  <div id="authModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="glass-card p-6 rounded-3xl max-w-sm w-full space-y-4 border-rose-500/40 max-h-[90vh] overflow-y-auto">
      <div class="text-center space-y-1">
        <i class="fa-solid fa-heart text-rose-500 text-3xl heart-glow"></i>
        <h2 id="authTitle" class="font-bold text-xl text-rose-300">Welcome to HeartSync</h2>
        <p class="text-xs text-gray-300">Sign up now & get <b class="text-amber-300">100 Coins Signup Bonus!</b></p>
      </div>

      <!-- Sign Up Form -->
      <div id="signupFormFields" class="space-y-2.5 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="regFirstName" placeholder="First Name" class="bg-black/60 border border-white/20 rounded-lg p-2 text-rose-200 outline-none">
          <input type="text" id="regLastName" placeholder="Last Name" class="bg-black/60 border border-white/20 rounded-lg p-2 text-rose-200 outline-none">
        </div>
        <input type="text" id="regUsername" placeholder="Username (Unique ID)" class="w-full bg-black/60 border border-white/20 rounded-lg p-2 text-rose-200 outline-none">
        <input type="tel" id="regPhone" placeholder="Phone Number" class="w-full bg-black/60 border border-white/20 rounded-lg p-2 text-rose-200 outline-none">
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-gray-300 block mb-1">My Gender:</label>
            <select id="regGender" class="w-full bg-black/60 border border-white/20 rounded-lg p-2 text-rose-200 outline-none">
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] text-gray-300 block mb-1">Looking For:</label>
            <select id="regLookingFor" class="w-full bg-black/60 border border-white/20 rounded-lg p-2 text-rose-200 outline-none">
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Other">Other</option>
              <option value="All" selected>All</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="regAge" placeholder="Age (e.g. 22)" class="bg-black/60 border border-white/20 rounded-lg p-2 text-rose-200 outline-none">
          <input type="password" id="regPassword" placeholder="Password" class="bg-black/60 border border-white/20 rounded-lg p-2 text-rose-200 outline-none">
        </div>

        <button type="button" onclick="submitRegistration()" class="w-full py-2.5 bg-gradient-to-r from-rose-500 to-pink-600 font-bold rounded-lg text-white shadow-lg cursor-pointer">Complete Sign Up (+100 Coins)</button>
        <p class="text-center text-[10px] text-gray-400 pt-1">Already registered? <span onclick="toggleAuthMode('login')" class="text-amber-300 underline cursor-pointer">Login here</span></p>
      </div>

      <!-- Login Form -->
      <div id="loginFormFields" class="space-y-3 text-xs hidden">
        <input type="text" id="logUsername" placeholder="Username" class="w-full bg-black/60 border border-white/20 rounded-lg p-2.5 text-rose-200 outline-none">
        <input type="password" id="logPassword" placeholder="Password" class="w-full bg-black/60 border border-white/20 rounded-lg p-2.5 text-rose-200 outline-none">
        <button type="button" onclick="submitLogin()" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-rose-600 font-bold rounded-lg text-white shadow-lg cursor-pointer">Login to Account</button>
        <p class="text-center text-[10px] text-gray-400 pt-1">New user? <span onclick="toggleAuthMode('signup')" class="text-rose-300 underline cursor-pointer">Sign up</span></p>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-40 glass-card px-4 py-3 flex items-center justify-between border-b border-rose-500/20">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-heart text-rose-500 text-2xl heart-glow"></i>
      <span class="font-bold text-xl tracking-wide bg-gradient-to-r from-rose-400 to-pink-500 bg-clip-text text-transparent">HeartSync</span>
    </div>
    
    <div class="flex items-center space-x-3">
      <div onclick="openModal('walletModal')" class="flex items-center bg-rose-950/60 border border-rose-500/40 px-3 py-1 rounded-full cursor-pointer hover:bg-rose-900/60 transition text-xs">
        <i class="fa-solid fa-coins text-amber-400 mr-1.5"></i>
        <div>
          <span id="userCoinsDisplay" class="font-bold text-amber-300">0</span> <span class="text-[10px] text-gray-300">(<span id="userUsdDisplay">$0.00</span>)</span>
        </div>
      </div>

      <button onclick="logoutUser()" title="Logout" class="p-2 text-rose-400 hover:text-white transition cursor-pointer">
        <i class="fa-solid fa-right-from-bracket text-lg"></i>
      </button>

      <button onclick="verifyAndOpenAdmin()" class="p-2 text-rose-300 hover:text-white transition cursor-pointer">
        <i class="fa-solid fa-shield-halved text-lg"></i>
      </button>
    </div>
  </header>

  <!-- Filter Controls -->
  <section class="p-4 max-w-md mx-auto space-y-3" id="filterSection">
    <div class="flex rounded-xl bg-black/40 p-1 border border-white/10 text-xs">
      <button onclick="setMode('Dating')" id="mode-Dating" class="flex-1 py-2 rounded-lg font-semibold bg-rose-600 text-white transition cursor-pointer">Dating 💕</button>
      <button onclick="setMode('Friendship')" id="mode-Friendship" class="flex-1 py-2 rounded-lg font-semibold text-gray-400 hover:text-white transition cursor-pointer">Friendship 🤝</button>
      <button onclick="setMode('Blind Date')" id="mode-Blind Date" class="flex-1 py-2 rounded-lg font-semibold text-gray-400 hover:text-white transition cursor-pointer">Blind Date 🎭</button>
    </div>

    <div class="grid grid-cols-2 gap-2 text-xs">
      <select id="genderFilter" onchange="renderProfiles()" class="bg-black/50 border border-white/10 rounded-lg p-2 text-rose-200 outline-none">
        <option value="All">Looking For: All</option>
        <option value="Female">Female</option>
        <option value="Male">Male</option>
        <option value="Other">Other</option>
      </select>
      <div class="flex items-center bg-black/50 border border-white/10 rounded-lg px-2">
        <span class="text-gray-400 mr-1">Max Age:</span>
        <input type="range" id="ageSlider" min="18" max="60" value="40" oninput="updateAgeLabel(this.value)" class="w-full accent-rose-500">
        <span id="ageLabel" class="ml-1 text-rose-300 font-bold">40</span>
      </div>
    </div>
  </section>

  <!-- MAIN APP VIEWS -->
  <!-- 1. DISCOVER / SWIPE FEED SECTION -->
  <main class="max-w-md mx-auto px-4" id="mainAppSection">
    <div id="cardStack" class="relative min-h-[460px]"></div>

    <!-- Swipe & Chat Action Bar -->
    <div class="flex items-center justify-around mt-4 max-w-xs mx-auto">
      <button onclick="swipe('dislike')" class="w-14 h-14 rounded-full glass-card border-rose-500/30 text-rose-400 hover:bg-rose-500 hover:text-white flex items-center justify-center text-xl transition shadow-lg cursor-pointer">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <button onclick="openChatWithCurrentProfile()" class="w-16 h-16 rounded-full bg-gradient-to-r from-rose-500 to-pink-600 text-white flex items-center justify-center text-2xl shadow-xl hover:scale-105 transition cursor-pointer">
        <i class="fa-solid fa-comments"></i>
      </button>
      <button onclick="swipe('like')" class="w-14 h-14 rounded-full glass-card border-emerald-500/30 text-emerald-400 hover:bg-emerald-500 hover:text-white flex items-center justify-center text-xl transition shadow-lg cursor-pointer">
        <i class="fa-solid fa-heart"></i>
      </button>
    </div>
  </main>

  <!-- DETAILED PUBLIC PROFILE VIEW MODAL -->
  <div id="publicProfileModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="glass-card p-5 rounded-3xl max-w-sm w-full space-y-4 max-h-[90vh] overflow-y
