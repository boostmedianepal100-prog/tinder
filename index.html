<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HeartSync</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#150a14;--bg2:#241026;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);
  --rose:#f43f5e;--pink:#ec4899;--amber:#fbbf24;--green:#34d399;--grey:#9ca3af;
  --text:#fff;
}
body{background:linear-gradient(160deg,#1a0b16 0%,#2d122d 45%,#170923 100%);
  background-attachment:fixed;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;padding-bottom:86px;overflow-x:hidden}
.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:20px}
.hide{display:none !important}
.wrap{max-width:460px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:40;background:rgba(21,10,20,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(244,63,94,.22);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:19px;
  background:linear-gradient(90deg,#fb7185,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.coinpill{display:flex;align-items:center;gap:6px;background:rgba(120,20,50,.55);
  border:1px solid rgba(244,63,94,.45);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;color:#fcd34d}
.hbtn{background:none;border:0;color:#fb7185;font-size:16px;padding:6px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:460px;margin:0 auto;
  background:rgba(26,12,26,.95);backdrop-filter:blur(14px);border-top:1px solid rgba(244,63,94,.22);
  display:flex;justify-content:space-around;padding:8px 4px 10px}
nav button{background:none;border:0;color:#8b7286;display:flex;flex-direction:column;align-items:center;
  gap:3px;font-size:9.5px;font-weight:600;flex:1;padding:2px}
nav button.on{color:#fb7185}
nav .ico{font-size:17px;line-height:1}
.btn{border:0;border-radius:13px;padding:12px 16px;font-size:14px;font-weight:700;color:#fff;
  background:linear-gradient(90deg,var(--rose),var(--pink));width:100%;cursor:pointer;display:block}
.btn:active{opacity:.85}
.btn.ghost{background:rgba(255,255,255,.09);border:1px solid var(--line)}
.btn.soft{background:rgba(244,63,94,.16);border:1px solid rgba(244,63,94,.4);color:#fda4af}
.btn.green{background:linear-gradient(90deg,#059669,#34d399)}
.btn.amber{background:linear-gradient(90deg,#d97706,#fbbf24);color:#231000}
.btn.red{background:linear-gradient(90deg,#b91c1c,#ef4444)}
.btn.sm{padding:8px 11px;font-size:12px;border-radius:10px;width:auto}
.btn:disabled{opacity:.45}
input,select,textarea{width:100%;background:rgba(0,0,0,.45);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;color:#ffe4e6;font-size:13.5px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:rgba(244,63,94,.7)}
label.lbl{display:block;font-size:11px;font-weight:700;color:#fbbf24;margin-bottom:5px;letter-spacing:.3px}
.field{margin-bottom:10px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.h1{font-size:22px;font-weight:800;margin-bottom:4px}
.h2{font-size:14.5px;font-weight:800;color:#fda4af;margin-bottom:8px}
.sub{font-size:11.5px;color:var(--grey);line-height:1.55}
.center{text-align:center}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid rgba(244,63,94,.5);flex:none;
  background:linear-gradient(135deg,#831843,#be185d);display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#fecdd3;font-size:15px}
.card{position:relative;border-radius:22px;overflow:hidden;border:1px solid rgba(244,63,94,.22);
  box-shadow:0 14px 40px rgba(0,0,0,.5);background:#241026}
.card .photo{width:100%;height:440px;object-fit:cover;display:block;background:#2a1430}
.card .noPhoto{width:100%;height:440px;display:flex;align-items:center;justify-content:center;
  font-size:64px;font-weight:800;color:rgba(255,255,255,.14);
  background:linear-gradient(160deg,#3b1229,#5b1a3d)}
.card .grad{position:absolute;left:0;right:0;bottom:0;padding:16px 14px 14px;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.94),rgba(0,0,0,.55) 55%,transparent)}
.card .nm{font-size:21px;font-weight:800;text-shadow:0 2px 8px #000}
.card .meta{font-size:11.5px;color:#fda4af;margin-top:2px}
.card .bio{font-size:11px;color:#d1d5db;margin-top:4px;line-height:1.45}
.pillrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:999px;
  background:rgba(255,255,255,.14);color:#f5d0d9}
.pill.fake{background:rgba(251,191,36,.22);color:#fcd34d}
.pill.on{background:rgba(52,211,153,.22);color:#6ee7b7}
.acts{display:flex;align-items:center;justify-content:space-around;margin-top:12px;gap:8px}
.act{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.act.big{width:62px;height:62px;font-size:24px;background:linear-gradient(135deg,var(--rose),var(--pink));border:0}
.act.no{color:#fb7185}
.act.heart{color:#34d399}
.act.star{color:#fbbf24}
.empty{padding:44px 20px;text-align:center;color:var(--grey);font-size:13px;line-height:1.6}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:15px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09)}
.item .txt{flex:1;min-width:0}
.item .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ms{font-size:10.5px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:14px}
.modal .box{width:100%;max-width:440px;max-height:90vh;overflow-y:auto;border-radius:22px;padding:16px;
  background:rgba(30,14,30,.98);border:1px solid rgba(244,63,94,.35)}
.modal .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal .top b{font-size:16px;color:#fda4af}
.x{background:none;border:0;color:#9ca3af;font-size:22px;line-height:1;padding:0 4px}
.chat{height:calc(100vh - 260px);overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:10px}
.bub{max-width:82%;padding:8px 11px;border-radius:14px;font-size:13px;line-height:1.45;word-break:break-word}
.bub.me{align-self:flex-end;background:linear-gradient(90deg,var(--rose),var(--pink));border-bottom-right-radius:5px}
.bub.them{align-self:flex-start;background:rgba(255,255,255,.1);border-bottom-left-radius:5px}
.bub .t{display:block;font-size:9px;opacity:.6;margin-top:3px}
.typing{display:flex;gap:7px;padding:10px 0}
.typing input{flex:1}
.badge{font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(244,63,94,.25);
  color:#fda4af;text-transform:uppercase;letter-spacing:.4px}
.badge.g{background:rgba(52,211,153,.2);color:#6ee7b7}
.badge.a{background:rgba(251,191,36,.2);color:#fcd34d}
.badge.r{background:rgba(239,68,68,.22);color:#fca5a5}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.07);
  border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:#8b7286}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .rm{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.75);border:0;color:#fca5a5;
  border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}
.steps{display:flex;gap:5px;margin-bottom:14px}
.steps i{height:4px;flex:1;border-radius:2px;background:rgba(255,255,255,.15)}
.steps i.on{background:linear-gradient(90deg,var(--rose),var(--pink))}
.subnav{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px;margin-bottom:10px}
.subnav button{flex:0 1 auto;font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:999px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);color:#c9b8c6}
.subnav button.on{background:linear-gradient(90deg,var(--rose),var(--pink));color:#fff;border-color:transparent}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,.07)}
.kv span:first-child{color:var(--grey)}
.kv span:last-child{font-weight:700;text-align:right;word-break:break-word;max-width:62%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;z-index:99;max-width:88%;
  background:rgba(15,8,14,.97);border:1px solid rgba(244,63,94,.5);color:#fecdd3;
  padding:11px 16px;border-radius:13px;font-size:12.5px;font-weight:600;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.6)}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--rose);
  border-radius:50%;animation:sp .8s linear infinite;margin:26px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.gallery{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{height:300px;border-radius:16px;object-fit:cover;scroll-snap-align:center;flex:none;max-width:100%}
.cmt{background:rgba(0,0,0,.35);border-radius:11px;padding:8px 10px;font-size:12px;margin-bottom:6px;line-height:1.45}
.cmt b{color:#fda4af}
.cmt .who{font-size:9.5px;color:var(--grey);margin-top:3px}
.tabs2{display:flex;gap:6px;margin-bottom:10px}
.tabs2 button{flex:1;font-size:11.5px;font-weight:700;padding:8px;border-radius:10px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);color:#c9b8c6}
.tabs2 button.on{background:rgba(244,63,94,.22);border-color:rgba(244,63,94,.6);color:#fecdd3}
.sect{margin-bottom:14px}
.warn{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:#fcd34d;
  font-size:11.5px;line-height:1.5;padding:9px 11px;border-radius:11px;margin-bottom:10px}
.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);color:#6ee7b7}
</style>
</head>
<body>

<header>
  <div class="brand">HeartSync</div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="coinpill" onclick="openRefer()" style="cursor:pointer"><span id="coinVal">0</span> coins<span id="coinMoney"></span></div>
    <button class="hbtn" id="btnRefresh" title="Refresh">&#8635;</button>
  </div>
</header>

<main id="stage" class="wrap" style="padding-top:14px"></main>

<nav id="nav" class="hide">
  <button data-tab="discover" class="on"><span class="ico">&#128293;</span>Discover</button>
  <button data-tab="chats"><span class="ico">&#128172;</span>Chats</button>
  <button data-tab="wallet"><span class="ico">&#128176;</span>Wallet</button>
  <button data-tab="me"><span class="ico">&#128100;</span>Profile</button>
  <button data-tab="admin" id="navAdmin" class="hide"><span class="ico">&#128737;</span>Admin</button>
</nav>

<script>
/* ============================================================
   HeartSync mini app - the bot is the database.
   Every call goes to this user's private API link.
   ============================================================ */
var QS = new URLSearchParams(location.search);
var API = QS.get('api') || '';
var ME = null;
var TAB = QS.get('tab') || 'discover';
var FEED = [];
var FEED_FILTER = { category: 'All', gender: 'All' };
var OPEN_CHAT = null;
var CHAT_TIMER = null;
var ADMIN_TAB = 'stats';
var AS_PROFILE = null;
var SU = { name:'', age:'', gender:'Male', looking:'Female', category:'Dating', city:'', bio:'' };
var PICK_SLOT = 1;
var UTIMER = null;

function el(id){ return document.getElementById(id); }
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function money(n){ return Number(n || 0).toLocaleString('en-US'); }
function when(ts){
  if (!ts) return '';
  var d = new Date(Number(ts) * 1000);
  return d.toLocaleDateString(undefined,{day:'2-digit',month:'short'}) + ' ' +
         d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function initial(n){ var s = String(n || '?').trim(); return (s[0] || '?').toUpperCase(); }

function toast(msg, ms){
  var d = document.createElement('div');
  d.className = 'toast'; d.innerHTML = msg;
  document.body.appendChild(d);
  setTimeout(function(){ d.style.opacity = '0'; d.style.transition = 'opacity .3s'; }, (ms || 2600) - 300);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, ms || 2600);
}

async function post(payload){
  if (!API) throw new Error('This page must be opened from the bot.');
  var r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload || {})
  });
  if (!r.ok) throw new Error('Server error ' + r.status);
  var j = await r.json();
  if (j && j.ok === true && j.result && typeof j.result === 'object') return j.result;
  if (j && typeof j.ok !== 'undefined') return j;
  return j;
}

function setCoins(n){
  ME = ME || {};
  ME.coins = Number(n || 0);
  if (el('coinVal')) el('coinVal').textContent = money(ME.coins);
}
function spin(){ el('stage').innerHTML = '<div class="spin"></div>'; }
function header(title, sub, right){
  return '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px">'
    + '<div><div class="h1">' + esc(title) + '</div>'
    + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>'
    + (right || '') + '</div>';
}

function openModal(html){
  closeModal();
  var d = document.createElement('div');
  d.className = 'modal'; d.id = 'theModal';
  d.innerHTML = '<div class="box"><div class="top"><b>HeartSync</b>'
    + '<button class="x" onclick="closeModal()">&times;</button></div>' + html + '</div>';
  document.body.appendChild(d);
  return d;
}
function closeModal(){
  var m = el('theModal');
  if (m && m.parentNode) m.parentNode.removeChild(m);
}

function compress(file, maxSide, quality){
  return new Promise(function(resolve){
    var img = new Image();
    var fr = new FileReader();
    fr.onload = function(e){ img.src = e.target.result; };
    img.onerror = function(){ resolve(''); };
    img.onload = function(){
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxSide / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * scale));
      c.height = Math.max(1, Math.round(h * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    fr.readAsDataURL(file);
  });
}

async function uploadPhoto(file, slot, forUid){
  var full = await compress(file, 720, 0.6);
  var thumb = await compress(file, 260, 0.5);
  if (!full || full.length < 200) throw new Error('Could not read that photo.');
  var payload = { slot: slot, full: full, thumb: thumb };
  if (forUid){ payload.action = 'a_fake_photo'; payload.uid = forUid; }
  else { payload.action = 'save_photo'; }
  return post(payload);
}

/* ---------------- boot ---------------- */
async function boot(){
  if (!API){
    el('stage').innerHTML = '<div class="glass" style="padding:24px">'
      + '<div style="font-size:40px;text-align:center">&#128149;</div>'
      + '<div class="h1 center" style="margin-top:10px">Open this from the bot</div>'
      + '<p class="sub center" style="margin-top:8px">Go back to Telegram and press the '
      + '<b>Open HeartSync</b> button. That link is private to your account.</p></div>';
    return;
  }
  spin();
  try {
    var r = await post({ action: 'boot' });
    if (!r.ok) throw new Error(r.error || 'Could not load.');
    ME = r;
    setCoins(r.coins);
    el('nav').classList.remove('hide');
    if (r.is_admin) el('navAdmin').classList.remove('hide');
    else el('navAdmin').classList.add('hide');
    if (!r.registered){ renderWelcome(); return; }
    go(TAB);
  } catch(e){
    el('stage').innerHTML = '<div class="glass" style="padding:20px">'
      + '<div class="warn">Could not reach the server.<br>' + esc(e.message) + '</div>'
      + '<button class="btn" onclick="boot()">Try again</button></div>';
  }
}

/* ---------------- welcome ---------------- */
function renderWelcome(){
  var bonus = (ME.settings && ME.settings.signup_bonus) || 100;
  el('stage').innerHTML = '<div class="glass" style="padding:20px">'
    + '<div class="center" style="font-size:44px">&#128149;</div>'
    + '<div class="h1 center" style="margin-top:6px">Welcome to HeartSync</div>'
    + '<p class="sub center" style="margin:8px 0 16px">Meet real people. Create your profile and get '
    + '<b style="color:#fcd34d">' + esc(bonus) + ' coins</b> free.</p>'
    + '<div class="glass" style="padding:12px;background:rgba(244,63,94,.1)">'
    + '<div class="sub" style="color:#fda4af;font-weight:700;margin-bottom:6px">What it costs</div>'
    + '<div class="kv"><span>Browsing, likes, follows</span><span style="color:#6ee7b7">Free</span></div>'
    + '<div class="kv"><span>Send a message</span><span>' + esc(ME.settings ? ME.settings.msg_price : 5) + ' coins</span></div>'
    + '<div class="kv" style="border:0"><span>Write a comment</span><span>' + esc(ME.settings ? ME.settings.comment_price : 2) + ' coins</span></div>'
    + '</div>'
    + '<button class="btn" style="margin-top:16px" onclick="renderSignup(1)">Create my profile</button>'
    + (ME.owner_set ? '' : '<button class="btn ghost" style="margin-top:8px" onclick="claimOwner()">This is my app - claim owner</button>')
    + '</div>';
}

async function claimOwner(){
  try {
    var r = await post({ action: 'a_claim' });
    if (!r.ok){ toast(esc(r.error)); return; }
    toast('You are now the owner. Open Admin.');
    await boot();
  } catch(e){ toast('Could not claim: ' + esc(e.message)); }
}

function renderSignup(step){
  var bar = '<div class="steps">' + [1,2,3].map(function(i){
    return '<i class="' + (i <= step ? 'on' : '') + '"></i>';
  }).join('') + '</div>';
  var body = '';
  if (step === 1){
    body = '<div class="field"><label class="lbl">YOUR NAME</label>'
      + '<input id="suName" placeholder="First name" value="' + esc(SU.name) + '"></div>'
      + '<div class="field"><label class="lbl">AGE</label>'
      + '<input id="suAge" type="number" inputmode="numeric" placeholder="e.g. 24" value="' + esc(SU.age) + '"></div>'
      + '<div class="field"><label class="lbl">CITY (optional)</label>'
      + '<input id="suCity" placeholder="Kathmandu" value="' + esc(SU.city) + '"></div>'
      + '<button class="btn" onclick="suNext(2)">Continue</button>';
  }
  if (step === 2){
    body = '<div class="h2">I am a...</div><div id="gWrap">'
      + ['Male','Female','Other'].map(function(v){
          return '<button class="btn ' + (SU.gender === v ? '' : 'ghost')
            + '" style="margin-bottom:6px" onclick="pickG(this)" data-g="' + v + '">' + v + '</button>';
        }).join('') + '</div>'
      + '<div class="h2" style="margin-top:14px">I want to meet...</div><div id="lWrap">'
      + ['Female','Male','Other','All'].map(function(v){
          return '<button class="btn ' + (SU.looking === v ? '' : 'ghost')
            + '" style="margin-bottom:6px" onclick="pickL(this)" data-l="' + v + '">' + v + '</button>';
        }).join('') + '</div>'
      + '<button class="btn" style="margin-top:12px" onclick="suNext(3)">Continue</button>';
  }
  if (step === 3){
    body = '<div class="h2">What are you here for?</div>'
      + '<select id="suCat" style="margin-bottom:12px">'
      + ['Dating','Friendship','Girlfriend','Boyfriend','Chat','Marriage'].map(function(c){
          return '<option value="' + c + '"' + (SU.category === c ? ' selected' : '') + '>' + c + '</option>';
        }).join('') + '</select>'
      + '<div class="field"><label class="lbl">ABOUT YOU (optional)</label>'
      + '<textarea id="suBio" rows="3" placeholder="A line about yourself">' + esc(SU.bio) + '</textarea></div>'
      + '<div class="warn">You must be 18 or older. Your name, age, city and photos are shown to other members.</div>'
      + '<button class="btn" onclick="doSignup()" id="suBtn">Create my profile</button>';
  }
  el('stage').innerHTML = '<div class="glass" style="padding:18px">' + bar + body + '</div>';
}

function pickG(b){
  SU.gender = b.getAttribute('data-g');
  var w = document.querySelectorAll('#gWrap .btn');
  for (var i = 0; i < w.length; i++) w[i].className = 'btn ghost';
  b.className = 'btn';
}
function pickL(b){
  SU.looking = b.getAttribute('data-l');
  var w = document.querySelectorAll('#lWrap .btn');
  for (var i = 0; i < w.length; i++) w[i].className = 'btn ghost';
  b.className = 'btn';
}
function suNext(step){
  if (step === 2){
    SU.name = (el('suName').value || '').trim();
    SU.age = (el('suAge').value || '').trim();
    SU.city = (el('suCity').value || '').trim();
    if (SU.name.length < 2){ toast('Please write your name.'); return; }
    var a = parseInt(SU.age, 10);
    if (!a || a < 18 || a > 99){ toast('You must be 18 or older.'); return; }
  }
  renderSignup(step);
}

async function doSignup(){
  SU.category = el('suCat').value;
  SU.bio = (el('suBio').value || '').trim();
  var b = el('suBtn'); b.disabled = true; b.textContent = 'Creating...';
  try {
    var r = await post({ action:'signup', name:SU.name, age:parseInt(SU.age,10),
      gender:SU.gender, looking:SU.looking, category:SU.category, city:SU.city, bio:SU.bio });
    if (!r.ok){
      toast(esc(r.error)); b.disabled = false; b.textContent = 'Create my profile'; return;
    }
    setCoins(r.coins);
    await boot();
    toast('Profile created. You got ' + esc(r.bonus) + ' coins. Now add your photos.', 4200);
    setTimeout(function(){ go('me'); }, 500);
  } catch(e){
    toast('Could not save: ' + esc(e.message));
    b.disabled = false; b.textContent = 'Create my profile';
  }
}

/* ---------------- router ---------------- */
function go(tab){
  if (!ME || !ME.registered){ renderWelcome(); return; }
  TAB = tab;
  var btns = document.querySelectorAll('#nav button');
  for (var i = 0; i < btns.length; i++){
    if (btns[i].getAttribute('data-tab') === tab) btns[i].classList.add('on');
    else btns[i].classList.remove('on');
  }
  if (CHAT_TIMER){ clearInterval(CHAT_TIMER); CHAT_TIMER = null; }
  if (tab === 'discover') renderDiscover();
  if (tab === 'chats') renderChats();
  if (tab === 'wallet') renderWallet();
  if (tab === 'me') renderMe();
  if (tab === 'admin') renderAdmin();
}
document.querySelectorAll('#nav button').forEach(function(b){
  b.onclick = function(){ go(b.getAttribute('data-tab')); };
});
el('btnRefresh').onclick = function(){ boot(); };

/* ---------------- discover ---------------- */
async function renderDiscover(){
  el('stage').innerHTML = header('Discover', 'Tap a card to see everything',
      '<button class="btn sm ghost" onclick="feedFilters()">Filter</button>')
    + '<div style="display:flex;justify-content:space-between;font-size:11px;color:#9ca3af;margin-bottom:8px">'
    + '<span>' + esc(FEED_FILTER.category) + ' / ' + esc(FEED_FILTER.gender) + '</span>'
    + '<span id="feedCount">loading...</span></div>'
    + '<div id="feedBox"></div>';
  try {
    var r = await post({ action:'feed', category: FEED_FILTER.category,
      gender: FEED_FILTER.gender, offset: 0 });
    if (!r.ok){ el('feedBox').innerHTML = '<div class="warn">' + esc(r.error) + '</div>'; return; }
    FEED = r.profiles || [];
    setCoins(r.coins);
    el('feedCount').textContent = FEED.length ? FEED.length + ' shown' : 'nobody yet';
    drawFeed();
  } catch(e){
    el('feedBox').innerHTML = '<div class="warn">Could not load: ' + esc(e.message) + '</div>';
  }
}

function drawFeed(){
  var box = el('feedBox');
  if (!box) return;
  if (!FEED.length){
    box.innerHTML = '<div class="empty glass" style="padding:34px 20px">'
      + '<div style="font-size:34px;margin-bottom:8px">&#128564;</div>'
      + 'No profiles match this filter yet.<br>Try another category, or check back soon.'
      + '<div style="margin-top:14px"><button class="btn ghost" onclick="feedFilters()">Change filter</button></div></div>';
    return;
  }
  var p = FEED[0];
  var img = p.thumb
    ? '<img class="photo" src="' + p.thumb + '" alt="">'
    : '<div class="noPhoto">' + esc(initial(p.name)) + '</div>';
  box.innerHTML = '<div class="card" onclick="openProfile(\'' + esc(p.uid) + '\')">' + img
    + '<div class="grad">'
    + '<div class="nm">' + esc(p.name) + ', ' + esc(p.age) + '</div>'
    + '<div class="meta">' + esc(p.gender) + ' / ' + esc(p.category)
    + (p.city ? ' / ' + esc(p.city) : '') + '</div>'
    + (p.bio ? '<div class="bio">' + esc(p.bio) + '</div>' : '')
    + '<div class="pillrow"><span class="pill">' + (p.photos || 0) + ' photos</span>'
    + (p.liked ? '<span class="pill on">liked</span>' : '')
    + (p.following ? '<span class="pill on">following</span>' : '')
    + '</div></div></div>'
    + '<div class="acts">'
    + '<button class="act no" onclick="doPass(\'' + esc(p.uid) + '\')">&#10005;</button>'
    + '<button class="act star" onclick="doFollow(\'' + esc(p.uid) + '\')">&#9733;</button>'
    + '<button class="act big" onclick="openProfile(\'' + esc(p.uid) + '\')">&#128065;</button>'
    + '<button class="act heart" onclick="doLike(\'' + esc(p.uid) + '\')">&#9829;</button>'
    + '</div>'
    + '<div class="row" style="margin-top:10px">'
    + '<button class="btn soft" onclick="startChat(\'' + esc(p.uid) + '\')">Message / '
    + esc(ME.settings ? ME.settings.msg_price : 5) + '</button>'
    + '<button class="btn ghost" onclick="openProfile(\'' + esc(p.uid) + '\')">Comment</button>'
    + '</div>'
    + (FEED.length > 1 ? '<p class="sub center" style="margin-top:10px">' + FEED.length
        + ' waiting - skip or like this one to move on</p>' : '');
}

function feedFilters(){
  var cats = ['All','Dating','Friendship','Girlfriend','Boyfriend','Chat','Marriage'];
  var gens = ['All','Female','Male','Other'];
  openModal('<div class="h2">Category</div><div id="fc">'
    + cats.map(function(c){
        return '<button class="btn ' + (FEED_FILTER.category === c ? '' : 'ghost')
          + '" style="margin-bottom:6px" data-v="' + c + '" onclick="setF(\'category\',this)">' + c + '</button>';
      }).join('') + '</div>'
    + '<div class="h2" style="margin-top:12px">Show me</div><div id="fg">'
    + gens.map(function(g){
        return '<button class="btn ' + (FEED_FILTER.gender === g ? '' : 'ghost')
          + '" style="margin-bottom:6px" data-v="' + g + '" onclick="setF(\'gender\',this)">' + g + '</button>';
      }).join('') + '</div>'
    + '<button class="btn" style="margin-top:12px" onclick="closeModal();renderDiscover()">Show profiles</button>');
}
function setF(kind, b){
  FEED_FILTER[kind] = b.getAttribute('data-v');
  var wrap = el(kind === 'category' ? 'fc' : 'fg');
  if (!wrap) return;
  var all = wrap.querySelectorAll('.btn');
  for (var i = 0; i < all.length; i++) all[i].className = 'btn ghost';
  b.className = 'btn';
}

async function doLike(uid){
  try {
    var r = await post({ action:'like', uid:uid });
    if (!r.ok){ toast(esc(r.error)); return; }
    toast(r.mutual ? 'It is a match - they liked you too!' : 'Liked!');
    FEED = FEED.filter(function(x){ return x.uid !== uid; });
    drawFeed();
  } catch(e){ toast('Failed: ' + esc(e.message)); }
}
async function doPass(uid){
  try {
    await post({ action:'pass', uid:uid });
    FEED = FEED.filter(function(x){ return x.uid !== uid; });
    drawFeed();
  } catch(e){ toast('Failed: ' + esc(e.message)); }
}
async function doFollow(uid){
  var p = null;
  for (var i = 0; i < FEED.length; i++) if (FEED[i].uid === uid) p = FEED[i];
  var on = p && p.following;
  try {
    var r = await post({ action: on ? 'unfollow' : 'follow', uid:uid });
    if (!r.ok){ toast(esc(r.error)); return; }
    if (p) p.following = r.following;
    toast(r.following ? 'Following' : 'Unfollowed');
    drawFeed();
  } catch(e){ toast('Failed: ' + esc(e.message)); }
}

/* ---------------- profile view ---------------- */
async function openProfile(uid){
  openModal('<div class="spin"></div>');
  try {
    var r = await post({ action:'profile', uid:uid });
    if (!r.ok){ closeModal(); toast(esc(r.error)); return; }
    setCoins(r.coins);
    var gal = '<div class="warn">No photos yet.</div>';
    if (r.photos && r.photos.length){
      gal = '<div class="gallery">' + r.photos.map(function(s){
        return '<img data-slot="' + s + '" src="">';
      }).join('') + '</div>';
    }
    var cm = '<p class="sub">No comments yet. Yours would be the first.</p>';
    if ((r.comments || []).length){
      cm = r.comments.map(function(c){
        return '<div class="cmt"><b>' + esc(c.n || 'Member') + '</b> ' + esc(c.txt)
          + '<div class="who">' + when(c.ts) + '</div></div>';
      }).join('');
    }
    openModal('<div style="font-size:22px;font-weight:800;color:#fda4af">' + esc(r.name) + ', ' + esc(r.age) + '</div>'
      + '<div class="sub" style="margin-bottom:10px">' + esc(r.gender) + ' / ' + esc(r.category)
      + (r.city ? ' / ' + esc(r.city) : '') + ' / ' + (r.fans || 0) + ' likes</div>'
      + gal
      + (r.bio ? '<p class="sub" style="margin-top:10px">' + esc(r.bio) + '</p>' : '')
      + '<div class="row" style="margin-top:12px">'
      + '<button class="btn soft" onclick="startChat(\'' + esc(uid) + '\')">Message / ' + esc(r.msg_price) + '</button>'
      + '<button class="btn ' + (r.liked ? 'green' : 'ghost') + '" onclick="likeFromModal(\'' + esc(uid) + '\')">'
      + (r.liked ? 'Liked' : 'Like') + '</button></div>'
      + '<div class="row" style="margin-top:8px">'
      + '<button class="btn ghost" onclick="followFromModal(\'' + esc(uid) + '\')">'
      + (r.following ? 'Following' : 'Follow') + '</button>'
      + '<button class="btn red" onclick="passFromModal(\'' + esc(uid) + '\')">Skip</button></div>'
      + '<div class="sect" style="margin-top:16px"><div class="h2">Comments</div>' + cm
      + '<div class="row" style="margin-top:8px;align-items:center">'
      + '<input id="cmTxt" placeholder="Write a comment..." style="flex:1">'
      + '<button class="btn sm" style="flex:none" onclick="postComment(\'' + esc(uid) + '\')">Post / '
      + esc(r.comment_price) + '</button></div></div>');

    if (r.photos && r.photos.length){
      for (var i = 0; i < r.photos.length; i++){
        try {
          var im = await post({ action:'img', uid:uid, slot:r.photos[i], size:'f' });
          if (im.ok && im.data){
            var nodes = document.querySelectorAll('[data-slot="' + r.photos[i] + '"]');
            for (var k = 0; k < nodes.length; k++) nodes[k].src = im.data;
          }
        } catch(e2){}
      }
    }
  } catch(e){
    closeModal(); toast('Could not open: ' + esc(e.message));
  }
}

async function startChat(uid){
  closeModal();
  await openChat(uid);
}

async function openChat(uid){
  OPEN_CHAT = uid;
  TAB = 'chats';
  var btns = document.querySelectorAll('#nav button');
  for (var i = 0; i < btns.length; i++){
    if (btns[i].getAttribute('data-tab') === 'chats') btns[i].classList.add('on');
    else btns[i].classList.remove('on');
  }
  el('stage').innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
    + '<button class="btn sm ghost" style="flex:none" onclick="go(\'chats\')">&larr;</button>'
    + '<div id="chatHead" class="h2" style="margin:0">Chat</div></div>'
    + '<div class="glass" style="padding:0;overflow:hidden">'
    + '<div class="chat" id="chatBox"><div class="spin"></div></div>'
    + '<div class="typing" style="padding:8px;border-top:1px solid rgba(255,255,255,.1)">'
    + '<input id="chatTxt" placeholder="Write a message..." style="flex:1">'
    + '<button class="btn sm" style="flex:none" onclick="sendMsg()">Send</button>'
    + '</div></div><p class="sub center" style="margin-top:8px" id="chatPrice"></p>';
  el('chatTxt').addEventListener('keydown', function(e){ if (e.key === 'Enter') sendMsg(); });
  await loadChat();
  if (CHAT_TIMER) clearInterval(CHAT_TIMER);
  CHAT_TIMER = setInterval(loadChat, 9000);
}

async function loadChat(){
  if (!OPEN_CHAT) return;
  try {
    var r = await post({ action:'chat', uid:OPEN_CHAT });
    if (!r.ok) return;
    setCoins(r.coins);
    if (el('chatHead')) el('chatHead').textContent = r.name;
    if (el('chatPrice')) el('chatPrice').textContent = 'Each message you send costs ' + r.msg_price + ' coins.';
    var box = el('chatBox');
    if (!box) return;
    if (!(r.messages || []).length){
      box.innerHTML = '<div class="empty" style="padding:26px 12px">Say hello to ' + esc(r.name) + '.</div>';
    } else {
      box.innerHTML = r.messages.map(function(m){
        return '<div class="bub ' + (m.me ? 'me' : 'them') + '">' + esc(m.txt)
          + '<span class="t">' + when(m.ts) + '</span></div>';
      }).join('');
      box.scrollTop = box.scrollHeight;
    }
  } catch(e){}
}

async function sendMsg(){
  var inp = el('chatTxt');
  var t = (inp.value || '').trim();
  if (!t || !OPEN_CHAT) return;
  inp.value = '';
  try {
    var r = await post({ action:'send', uid:OPEN_CHAT, text:t });
    if (!r.ok){ toast(esc(r.error)); inp.value = t; return; }
    setCoins(r.coins);
    await loadChat();
  } catch(e){ toast('Failed: ' + esc(e.message)); inp.value = t; }
}

/* ---------------- wallet ---------------- */
function badge(st){
  var s = String(st || '');
  var cls = (s === 'approved' || s === 'paid') ? 'g' : (s === 'pending' ? 'a' : 'r');
  return ' <span class="badge ' + cls + '">' + esc(s) + '</span>';
}

async function renderWallet(){
  el('stage').innerHTML = header('Wallet', 'Deposits and withdrawals') + '<div id="wBox"><div class="spin"></div></div>';
  try {
    var r = await post({ action:'wallet' });
    if (!r.ok){ el('wBox').innerHTML = '<div class="warn">' + esc(r.error) + '</div>'; return; }
    setCoins(r.coins);
    var usedMsg = '';
    if (r.withdraws_used >= r.max_withdraws){
      usedMsg = '<div class="warn">You already used your payout (' + r.withdraws_used + ' of '
        + r.max_withdraws + '). Your coins stay on the platform for chatting.</div>';
    }
    var depList = (r.deposits || []).length
      ? r.deposits.map(function(d){
          return '<div class="kv"><span>' + when(d.ts) + ' / ' + esc(d.m) + '</span><span>'
            + money(d.amt) + badge(d.st) + '</span></div>';
        }).join('')
      : '<p class="sub">Nothing yet.</p>';
    var wdList = (r.withdraws || []).length
      ? r.withdraws.map(function(w){
          return '<div class="kv"><span>' + when(w.ts) + ' / ' + esc(w.m) + '</span><span>'
            + money(w.amt) + badge(w.st) + '</span></div>';
        }).join('')
      : '<p class="sub">Nothing yet.</p>';
    var methods = r.methods || [];
    var wd = r.wd || {};

    el('wBox').innerHTML = '<div class="glass" style="padding:16px;text-align:center;margin-bottom:12px">'
      + '<div class="sub">Your balance</div>'
      + '<div style="font-size:36px;font-weight:800;color:#fcd34d;margin:4px 0">' + money(r.coins) + '</div>'
      + '<div class="sub">' + esc(r.rate) + ' coins = 1 payout unit</div></div>'

      + '<div class="glass" style="padding:14px;margin-bottom:12px">'
      + '<div class="h2">Add coins</div>'
      + methods.map(function(m){
          return '<div class="item" style="margin-bottom:6px"><div class="txt">'
            + '<div class="nm">' + esc(m.name) + '</div>'
            + '<div class="ms" style="white-space:normal">' + esc(m.detail) + '</div></div></div>';
        }).join('')
      + '<div class="field" style="margin-top:10px"><label class="lbl">AMOUNT YOU PAID</label>'
      + '<input id="depAmt" type="number" inputmode="numeric" placeholder="e.g. 100"></div>'
      + '<div class="field"><label class="lbl">PAYMENT METHOD</label><select id="depMethod">'
      + methods.map(function(m){
          return '<option value="' + esc(m.id) + '">' + esc(m.name) + '</option>';
        }).join('') + '</select></div>'
      + '<div class="field"><label class="lbl">TRANSACTION ID / REFERENCE</label>'
      + '<input id="depRef" placeholder="Code from your payment app"></div>'
      + '<div class="field"><label class="lbl">SCREENSHOT OF THE PAYMENT</label>'
      + '<input id="depShot" type="file" accept="image/*"></div>'
      + '<button class="btn" onclick="submitDeposit()" id="depBtn">Send for approval</button></div>'

      + '<div class="glass" style="padding:14px;margin-bottom:12px">'
      + '<div class="h2">Withdraw</div>' + usedMsg
      + '<div class="sub" style="margin-bottom:8px">Minimum ' + esc(r.min_withdraw)
      + ' coins. Payout is limited to ' + esc(r.max_withdraws) + ' per account.</div>'
      + '<div class="field"><label class="lbl">AMOUNT</label>'
      + '<input id="wdAmt" type="number" inputmode="numeric" placeholder="' + esc(r.min_withdraw) + '"></div>'
      + '<div class="field"><label class="lbl">PAY TO (your number / account)</label>'
      + '<input id="wdAcct" placeholder="98XXXXXXXX" value="' + esc(wd.account || '') + '"></div>'
      + '<div class="field"><label class="lbl">METHOD</label><select id="wdMethod">'
      + methods.map(function(m){
          return '<option value="' + esc(m.name) + '"' + (wd.method === m.name ? ' selected' : '') + '>'
            + esc(m.name) + '</option>';
        }).join('') + '</select></div>'
      + '<button class="btn amber" onclick="submitWithdraw()" id="wdBtn"'
      + (r.withdraws_used >= r.max_withdraws ? ' disabled' : '') + '>Request withdrawal</button></div>'

      + '<div class="glass" style="padding:14px;margin-bottom:12px"><div class="h2">My deposits</div>'
      + depList + '</div>'
      + '<div class="glass" style="padding:14px"><div class="h2">My withdrawals</div>'
      + wdList + '</div>';
  } catch(e){ el('wBox').innerHTML = '<div class="warn">' + esc(e.message) + '</div>'; }
}

async function submitDeposit(){
  var amt = parseInt(el('depAmt').value || '0', 10);
  var method = el('depMethod').value;
  var ref = (el('depRef').value || '').trim();
  var file = el('depShot').files[0];
  if (!amt || amt < 10){ toast('Enter the amount you paid.'); return; }
  if (!file){ toast('Please attach the payment screenshot.'); return; }
  var b = el('depBtn'); b.disabled = true; b.textContent = 'Uploading...';
  try {
    var shot = await compress(file, 900, 0.6);
    if (!shot || shot.length < 200) throw new Error('Could not read that photo.');
    var r = await post({ action:'deposit_req', amount:amt, method:method, ref:ref, photo:shot });
    if (!r.ok){
      toast(esc(r.error)); b.disabled = false; b.textContent = 'Send for approval'; return;
    }
    toast('Sent for approval. You will get a Telegram message when it is confirmed.', 4200);
    renderWallet();
  } catch(e){
    toast('Failed: ' + esc(e.message));
    b.disabled = false; b.textContent = 'Send for approval';
  }
}

async function submitWithdraw(){
  var amt = parseInt(el('wdAmt').value || '0', 10);
  var acct = (el('wdAcct').value || '').trim();
  var method = el('wdMethod').value;
  if (!amt){ toast('Enter an amount.'); return; }
  if (!acct){ toast('Enter where to send the payout.'); return; }
  var b = el('wdBtn'); b.disabled = true; b.textContent = 'Sending...';
  try {
    var r = await post({ action:'withdraw_req', amount:amt, account:acct, method:method });
    if (!r.ok){
      toast(esc(r.error)); b.disabled = false; b.textContent = 'Request withdrawal'; return;
    }
    setCoins(r.coins);
    toast('Withdrawal requested. The admin will pay it.', 4200);
    renderWallet();
  } catch(e){
    toast('Failed: ' + esc(e.message));
    b.disabled = false; b.textContent = 'Request withdrawal';
  }
}

/* ---------------- my profile ---------------- */
async function renderMe(){
  el('stage').innerHTML = header('My Profile', 'This is what others see') + '<div id="meBox"><div class="spin"></div></div>';
  try {
    var r = await post({ action:'boot' });
    ME = r; setCoins(r.coins);
    var p = r.profile || {};

function chooseSlot(){
  var p = ME.profile || {};
  var ph = p.photos || [];
  var free = [1,2,3,4,5].filter(function(s){ return ph.indexOf(s) < 0; });
  if (!free.length){ toast('You already have 5 photos.'); return; }
  PICK_SLOT = free[0];
  el('photoPick').click();
}
async function pickPhoto(inp){
  var f = inp.files[0];
  if (!f) return;
  toast('Uploading photo...', 6000);
  try {
    await uploadPhoto(f, PICK_SLOT, null);
    toast('Photo added.');
    renderMe();
  } catch(e){ toast('Failed: ' + esc(e.message)); }
  inp.value = '';
}
async function delPhoto(slot){
  try { await post({ action:'del_photo', slot:slot }); renderMe(); }
  catch(e){ toast(esc(e.message)); }
}
async function saveMe(){
  try {
    var r = await post({ action:'save_profile',
      name: el('edName').value.trim(), age: parseInt(el('edAge').value, 10),
      city: el('edCity').value.trim(), gender: el('edGender').value,
      looking: el('edLooking').value, category: el('edCat').value,
      bio: el('edBio').value.trim() });
    if (!r.ok){ toast(esc(r.error)); return; }
    toast('Saved.');
    await boot();
    renderMe();
  } catch(e){ toast(esc(e.message)); }
}

/* ============ language / country / currency extension ============ */
var LANG = 'en', I18N = {}, EN = {}, DOM_MAP = {}, COUNTRIES = [], CURRENCIES = [], MYCUR = 'USD';
var OBS = null, BUSY = false, NAVDONE = false;

function T(key, fb){ var v = I18N[key] || EN[key] || fb; return v ? v : ''; }

function buildDomMap(){
  DOM_MAP = {};
  for (var k in EN){
    var e = EN[k], d = I18N[k] || e;
    if (e) DOM_MAP[String(e).toLowerCase()] = d;
  }
}

function translateDom(){
  if (BUSY || LANG === 'en') return;
  BUSY = true;
  try {
    var walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    var n = walk.nextNode();
    while (n){
      var key = String(n.nodeValue || '').trim().toLowerCase();
      if (key && DOM_MAP[key] && DOM_MAP[key] !== n.nodeValue) n.nodeValue = DOM_MAP[key];
      n = walk.nextNode();
    }
    var ins = document.querySelectorAll('input[placeholder]');
    for (var i = 0; i < ins.length; i++){
      var pk = String(ins[i].getAttribute('placeholder') || '').toLowerCase();
      if (DOM_MAP[pk]) ins[i].setAttribute('placeholder', DOM_MAP[pk]);
    }
  } catch(e){}
  BUSY = false;
}

function watchDom(){
  if (OBS || !window.MutationObserver) return;
  OBS = new MutationObserver(function(){
    if (BUSY) return;
    setTimeout(translateDom, 80);
  });
  OBS.observe(el('stage'), { childList: true, subtree: true });
}

  LANG = lang || 'en';
  try {
    var r = await _post({ action: 'tr', lang: LANG });
    if (r && r.ok){ I18N = r.d || {}; EN = r.en || {}; }
  } catch(e){}
  buildDomMap();

}

var _post = post;
post = async function(payload){
  payload = payload || {};
  var a = payload.action;
  if (a === 'feed' && payload.country === undefined){
    payload.country = FEED_FILTER.country || 'All';
  }
  if (a === 'signup' || a === 'save_profile'){
    if (payload.country === undefined && SU.country) payload.country = SU.country;
    if (payload.search_country === undefined && SU.search_country) payload.search_country = SU.search_country;
    if (payload.currency === undefined) payload.currency = MYCUR;
    if (payload.lang === undefined) payload.lang = LANG;
  }
  var r = await _post(payload);
  if (a === 'boot' && r && r.ok){
    MYCUR = r.currency || 'USD';
    LANG = r.lang || 'en';
    await applyLang(LANG);
    addNav();
    watchDom();
    refreshMoney();
    maybeDaily(r);
  }
  return r;
};

  if (!ME || !ME.registered){ renderWelcome(); return; }
  if (!COUNTRIES.length || !LANGS_LIST.length){
    el('stage').innerHTML = '<div class="spin"></div>';
    if (!COUNTRIES.length) await loadGeo();
    if (!LANGS_LIST.length) await loadLangs();
  }
  var tabs = document.querySelectorAll('#nav button');
  for (var i = 0; i < tabs.length; i++){
    if (tabs[i].getAttribute('data-tab') === 'geo') tabs[i].classList.add('on');
    else tabs[i].classList.remove('on');
  }
  var p = ME.profile || {};
  var myCountry = p.country || SU.country || '';
  var look = p.search_country || 'All';
  el('stage').innerHTML = header(T('country', 'Country'), T('language', 'Language') + ' / ' + T('currency', 'Currency'))
    + '<div id="geoBox"><div class="spin"></div></div>';

  var lo = '';
  for (var j = 0; j < LANGS_LIST.length; j++){
    var L = LANGS_LIST[j];
    lo += '<option value="' + esc(L.code) + '"' + (L.code === LANG ? ' selected' : '') + '>'
        + esc((L.flag ? L.flag + ' ' : '') + L.name) + '</option>';
  }

  el('geoBox').innerHTML =
    '<div class="glass" style="padding:14px;margin-bottom:12px">'
    + '<div class="h2">' + esc(T('my_country', 'My country')) + '</div>'
    + '<div class="field"><select id="gMy">' + countryOpts(myCountry) + '</select></div>'
    + '<div class="h2">' + esc(T('search_in_country', 'Which country are you looking in?')) + '</div>'
    + '<div class="field"><select id="gLook"><option value="All">'
    + esc(T('everyone', 'Everyone')) + '</option><option value="Mine"'
    + (look === 'Mine' ? ' selected' : '') + '>' + esc(T('my_country_only', 'My country only'))
    + '</option>' + countryOpts(look) + '</select></div>'
    + '<button class="btn" onclick="saveGeo()">' + esc(T('save_changes', 'Save changes')) + '</button>'
    + '</div>'

    + '<div class="glass" style="padding:14px;margin-bottom:12px">'
    + '<div class="h2">' + esc(T('currency', 'Currency')) + '</div>'
    + '<div id="curInfo" class="sub" style="margin-bottom:8px">...</div>'
    + '<div class="field"><select id="gCur">' + curOpts(MYCUR) + '</select></div>'
    + '<button class="btn amber" onclick="saveCur()">' + esc(T('save', 'Save')) + '</button>'
    + '</div>'

    + '<div class="glass" style="padding:14px">'
    + '<div class="h2">' + esc(T('choose_language', 'Choose your language')) + '</div>'
    + '<div class="field"><select id="gLang">' + lo + '</select></div>'
    + '<button class="btn" onclick="saveLang()">' + esc(T('save', 'Save')) + '</button>'
    + '</div>';

  try {
    var m = await _post({ action: 'money', currency: MYCUR });
    if (m && m.ok && el('curInfo')){
      el('curInfo').innerHTML = esc(m.coins) + ' coins = ' + esc(m.currency) + ' ' + esc(m.pretty)
        + '<br>1 USD = ' + esc(m.rate) + ' ' + esc(m.currency);
    }
  } catch(e){}
  translateDom();
}

async function saveGeo(){
  try {
    var r = await _post({ action: 'save_profile',
      country: el('gMy').value, search_country: el('gLook').value });
    if (!r.ok){ toast(esc(r.error)); return; }
    SU.country = el('gMy').value;
    SU.search_country = el('gLook').value;
    toast(esc(T('saved', 'Saved')));
    await boot();
    renderGeo();
  } catch(e){ toast(esc(e.message)); }
}
async function saveCur(){
  try {
    var r = await _post({ action: 'set_currency', currency: el('gCur').value });
    if (!r.ok){ toast(esc(r.error)); return; }
    MYCUR = r.currency;
    toast(esc(T('saved', 'Saved')));
    renderGeo();
  } catch(e){ toast(esc(e.message)); }
}
async function saveLang(){
  try {
    var code = el('gLang').value;
    var r = await _post({ action: 'set_lang', lang: code });
    if (!r.ok){ toast(esc(r.error)); return; }
    await applyLang(code);
    toast(esc(T('saved', 'Saved')));
    renderGeo();
  } catch(e){ toast(esc(e.message)); }
}

/* ---- daily login bonus ---- */
var DAILY_SHOWN = false;

function waitText(sec){
  var s = Number(sec || 0);
  if (s <= 0) return '';
  var h = Math.floor(s / 3600);
  var m = Math.floor((s % 3600) / 60);
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}

function maybeDaily(r){
  if (!r || !r.daily || !ME || !ME.registered) return;
  if (r.daily.ready !== 1) return;
  if (r.daily.bonus < 1) return;
  if (DAILY_SHOWN) return;
  DAILY_SHOWN = true;
  var old = el('dailyBar');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  var d = document.createElement('div');
  d.id = 'dailyBar';
  d.className = 'glass';
  /* fixed, so drawing another tab can never erase it */
  d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);'
    + 'top:58px;width:calc(100% - 28px);max-width:432px;z-index:45;padding:12px 14px;'
    + 'border-color:rgba(251,191,36,.55);background:rgba(40,26,10,.97)';
  d.innerHTML = '<div style="display:flex;align-items:center;gap:10px">'
    + '<div style="font-size:24px">&#127873;</div>'
    + '<div style="flex:1;min-width:0"><div style="font-weight:800;color:#fcd34d;font-size:13px">'
    + esc(r.daily.bonus) + ' ' + esc(T('coins', 'coins')) + '</div>'
    + '<div class="sub" style="font-size:10.5px">'
    + esc(T('daily_ready', 'Your daily login bonus is ready.')) + '</div></div>'
    + '<button class="btn sm" style="flex:none" onclick="claimDaily(this)">'
    + esc(T('claim', 'Claim')) + '</button>'
    + '<button class="x" style="flex:none;font-size:18px" onclick="hideDaily()">&times;</button>'
    + '</div>';
  document.body.appendChild(d);
}

function hideDaily(){
  var d = el('dailyBar');
  if (d && d.parentNode) d.parentNode.removeChild(d);
}

async function claimDaily(btn){
  if (btn){ btn.disabled = true; btn.textContent = '...'; }
  try {
    var r = await _post({ action: 'claim_daily' });
    if (!r.ok){
      if (r.wait) toast('Already claimed. Come back in ' + waitText(r.wait) + '.');
      else toast(esc(r.error));
      if (btn){ btn.disabled = false; btn.textContent = 'Claim'; }
      return;
    }
    setCoins(r.coins);
    toast('🎁 +' + r.bonus + ' ' + T('coins', 'coins') + '. ' + money(r.coins), 3600);
    hideDaily();
  } catch(e){
    toast('Failed: ' + esc(e.message));
    if (btn){ btn.disabled = false; btn.textContent = 'Claim'; }
  }
}

async function loadNetworkCounts(){
  var box = el('netCounts');
  if (!box) return;
  try {
    var r = await _post({ action: 'network' });
    if (!r.ok) return;
    box.innerHTML = esc(T('following_count', 'Following')) + ': <b>' + r.following_count
      + '</b> &middot; ' + esc(T('liked_count', 'Likes received')) + ': <b>'
      + r.liked_me_count + '</b>';
  } catch(e){}
}

async function openNetwork(kind){
  openModal('<div class="spin"></div>');
  try {
    var r = await _post({ action: 'network' });
    if (!r.ok){ closeModal(); toast(esc(r.error)); return; }
    var rows = kind === 'following' ? (r.following || []) : (r.liked_me || []);
    var title = kind === 'following' ? T('who_i_follow', 'Who I follow')
                                     : T('who_liked_me', 'Who liked me');
    var body = '';
    if (!rows.length){
      body = '<div class="empty">' + esc(T('nobody_yet', 'Nobody yet.')) + '</div>';
    } else {
      body = '<div class="list">' + rows.map(function(p){
        var av = p.thumb ? '<img class="avatar" src="' + p.thumb + '">'
                         : '<div class="avatar">' + esc(initial(p.name)) + '</div>';
        var act = '';
        if (kind === 'following'){
          act = '<button class="btn sm ghost" style="flex:none" onclick="unfollowFrom(\''
            + esc(p.uid) + '\')">' + esc(T('unfollow', 'Unfollow')) + '</button>';
        } else {
          act = '<button class="btn sm" style="flex:none" onclick="likeBack(\''
            + esc(p.uid) + '\')">♥</button>';
        }
        return '<div class="item"><div onclick="closeModal();openProfile(\'' + esc(p.uid) + '\')"'
          + ' style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">' + av
          + '<div class="txt"><div class="nm">' + esc(p.name) + ', ' + esc(p.age) + '</div>'
          + '<div class="ms">' + esc(p.gender) + (p.country ? ' / ' + esc(p.country) : '')
          + (p.city ? ' / ' + esc(p.city) : '') + '</div></div></div>' + act + '</div>';
      }).join('') + '</div>';
    }
    openModal('<div class="h2">' + esc(title) + ' (' + rows.length + ')</div>' + body);
    translateDom();
  } catch(e){ closeModal(); toast(esc(e.message)); }
}

async function unfollowFrom(uid){
  try {
    var r = await _post({ action: 'unfollow', uid: uid });
    if (!r.ok){ toast(esc(r.error)); return; }
    toast(esc(T('unfollowed', 'Unfollowed')));
    openNetwork('following');
    loadNetworkCounts();
  } catch(e){ toast(esc(e.message)); }
}

async function likeBack(uid){
  try {
    var r = await _post({ action: 'like', uid: uid });
    if (!r.ok){ toast(esc(r.error)); return; }
    toast(r.mutual ? '💕 Match!' : '♥ Liked back');
  } catch(e){ toast(esc(e.message)); }
}

/* refresh the counts whenever the profile tab is drawn */
var _renderMe = renderMe;
renderMe = async function(){
  await _renderMe();
  loadNetworkCounts();
  loadReferCounts();
  translateDom();
};

/* keep the header money figure in step with the coin balance */
var _setCoins = setCoins;
setCoins = function(n){
  _setCoins(n);
  if (!MONEY) return;
  var cpu = Number(MONEY.coins_per_usd || 100);
  if (cpu < 1) cpu = 100;
  var local = (Number(n || 0) / cpu) * Number(MONEY.rate || 1);
  var pretty = local >= 1000 ? local.toLocaleString('en-US', { maximumFractionDigits: 0 })
                             : local.toLocaleString('en-US', { maximumFractionDigits: 2 });
  var pill = el('coinMoney');
  if (pill) pill.textContent = ' · ' + MONEY.currency + ' ' + pretty;
};

/* ---- money shown in the header pill ---- */
var MONEY = null;

async function refreshMoney(){
  try {
    var m = await _post({ action: 'money', currency: MYCUR });
    if (!m || !m.ok) return;
    MONEY = m;
    var n = el('coinMoney');
    if (n) n.textContent = ' · ' + m.currency + ' ' + m.pretty;
  } catch(e){}
}

/* ---- refer and earn ---- */
function copyText(txt, btn){
  var done = function(){
    toast(esc(T('refer_copied', 'Link copied')));
    if (btn){ btn.textContent = T('refer_copied', 'Copied'); setTimeout(function(){ if (btn) btn.textContent = T('refer_copy', 'Copy link'); }, 1800); }
  };
  try {
    navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); });
  } catch(e){
    try { fallbackCopy(txt); done(); } catch(e2){ toast(esc(txt)); }
  }
}
function fallbackCopy(txt){
  var ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.cssText = 'position:fixed;left:-2000px;top:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  if (ta.parentNode) ta.parentNode.removeChild(ta);
}

async function openRefer(){
  if (!ME || !ME.registered){ toast('Create your profile first.'); return; }
  openModal('<div class="spin"></div>');
  try {
    var r = await _post({ action: 'ref_info' });
    if (!r.ok){ closeModal(); toast(esc(r.error)); return; }
    var list = r.list || [];
    var rows = '';
    if (list.length){
      rows = '<div class="list">' + list.map(function(x){
        return '<div class="item"><div class="avatar">' + esc(initial(x.name)) + '</div>'
          + '<div class="txt"><div class="nm">' + esc(x.name) + '</div>'
          + '<div class="ms">' + when(x.joined) + '</div></div>'
          + (x.paid ? '<span class="badge g">paid</span>' : '<span class="badge a">waiting</span>')
          + '</div>';
      }).join('') + '</div>';
    } else {
      rows = '<p class="sub">' + esc(T('refer_none', 'You have not invited anyone yet.')) + '</p>';
    }
    var moneyLine = '';
    if (MONEY){
      var per = (r.bonus / (MONEY.coins_per_usd || 100)) * (MONEY.rate || 1);
      moneyLine = '<div class="sub" style="margin-top:6px">1 ' + esc(T('refer_bonus','bonus'))
        + ' = ' + money(r.bonus) + ' coins = ' + esc(MONEY.currency) + ' '
        + (per >= 1000 ? per.toLocaleString('en-US',{maximumFractionDigits:0})
                       : per.toLocaleString('en-US',{maximumFractionDigits:2}))
        + ' &middot; 100 coins = 1 USD</div>';
    }
    openModal('<div style="font-size:20px;font-weight:800;color:#6ee7b7">'
      + esc(T('refer_head', 'Invite friends and earn real money')) + '</div>'
      + '<p class="sub" style="margin:6px 0 12px">' + esc(T('refer_sub', 'Every friend who joins with your link and pays once gives you a bonus.')) + '</p>'
      + '<div class="row" style="margin-bottom:12px">'
      + '<div class="glass" style="padding:10px;text-align:center;flex:1"><div style="font-size:20px;font-weight:800">' + money(r.invited) + '</div><div class="sub">' + esc(T('refer_invited', 'People invited')) + '</div></div>'
      + '<div class="glass" style="padding:10px;text-align:center;flex:1"><div style="font-size:20px;font-weight:800;color:#6ee7b7">' + money(r.qualified) + '</div><div class="sub">' + esc(T('refer_qualified', 'Paid and counted')) + '</div></div>'
      + '<div class="glass" style="padding:10px;text-align:center;flex:1"><div style="font-size:20px;font-weight:800;color:#fcd34d">' + money(r.earned) + '</div><div class="sub">' + esc(T('refer_earned', 'Coins earned')) + '</div></div></div>'
      + '<div class="field"><label class="lbl">' + esc(T('refer_your_link', 'Your personal invite link')) + '</label>'
      + '<input id="refLink" readonly value="' + esc(r.link) + '" style="font-size:11.5px"></div>'
      + '<div class="row">'
      + '<button class="btn" onclick="copyText(\'' + esc(r.link) + '\', this)">' + esc(T('refer_copy', 'Copy link')) + '</button>'
      + '<button class="btn green" style="flex:none" onclick="shareRefer(\'' + esc(r.link) + '\')">' + esc(T('refer_share', 'Share')) + '</button>'
      + '</div>' + moneyLine
      + '<div class="h2" style="margin-top:16px">' + esc(T('refer_terms_title', 'Terms and conditions')) + '</div>'
      + '<div class="sub" style="line-height:1.7">'
      + '<b>1.</b> ' + esc(T('refer_t1', 'Share your link with friends.')) + '<br>'
      + '<b>2.</b> ' + esc(T('refer_t2', 'You earn the bonus only after that person signs up AND pays at least the minimum deposit.')) + '<br>'
      + '<b>3.</b> ' + esc(T('refer_t3', 'The bonus is paid once per person, never twice for the same friend.')) + '<br>'
      + '<b>4.</b> ' + esc(T('refer_t4', 'You may not invite yourself or use fake accounts.')) + '<br>'
      + '<b>5.</b> ' + esc(T('refer_t5', 'Bonus coins work like any other coins.')) + '<br>'
      + '<b>6.</b> ' + esc(T('refer_t6', 'Withdrawal follows the normal rules of the app.')) + '<br>'
      + '<b>7.</b> ' + esc(T('refer_t7', 'The bonus amount and minimum deposit can change.')) + '<br>'
      + '<b>8.</b> ' + esc(T('refer_t8', 'If a payment is refunded, the bonus is taken back.')) + '</div>'
      + '<div class="warn" style="margin-top:10px">' + esc(T('refer_rule', 'Minimum deposit to count: ')) + money(r.min_coins) + ' ' + esc(T('coins', 'coins'))
      + ' &middot; ' + esc(T('refer_bonus_each', 'Bonus each time')) + ': ' + money(r.bonus) + ' ' + esc(T('coins', 'coins')) + '</div>'
      + '<div class="h2" style="margin-top:16px">' + esc(T('refer_invited', 'People invited')) + '</div>' + rows);
    translateDom();
  } catch(e){ closeModal(); toast(esc(e.message)); }
}

function shareRefer(link){
  var txt = T('refer_share_text', 'Join me on HeartSync');
  try {
    if (window.Telegram && Telegram.WebApp && Telegram.WebApp.switchInlineQuery){
      Telegram.WebApp.switchInlineQuery(link, ['users', 'groups']);
      return;
    }
  } catch(e){}
  try {
    if (navigator.share){
      navigator.share({ title: 'HeartSync', text: txt, url: link });
      return;
    }
  } catch(e){}
  window.open('https://t.me/share/url?url=' + encodeURIComponent(link)
    + '&text=' + encodeURIComponent(txt), '_blank');
}

async function loadReferCounts(){
  var box = el('refCounts');
  if (!box) return;
  try {
    var r = await _post({ action: 'ref_info' });
    if (!r || !r.ok) return;
    box.innerHTML = esc(T('refer_invited', 'Invited')) + ': <b>' + r.invited + '</b> · '
      + esc(T('refer_qualified', 'Paid')) + ': <b>' + r.qualified + '</b> · '
      + esc(T('refer_earned', 'Earned')) + ': <b>' + money(r.earned) + '</b> '
      + esc(T('coins', 'coins'));
  } catch(e){}
}

loadLangs();
loadGeo();
boot();
</script>
