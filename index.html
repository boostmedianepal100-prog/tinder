<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HeartSync</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#150a14;--bg2:#241026;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);
  --rose:#f43f5e;--pink:#ec4899;--amber:#fbbf24;--green:#34d399;--grey:#9ca3af;
  --text:#fff;
}
body{background:linear-gradient(160deg,#1a0b16 0%,#2d122d 45%,#170923 100%);
  background-attachment:fixed;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;padding-bottom:86px;overflow-x:hidden}
.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:20px}
.hide{display:none !important}
.wrap{max-width:460px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:40;background:rgba(21,10,20,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(244,63,94,.22);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:19px;
  background:linear-gradient(90deg,#fb7185,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.coinpill{display:flex;align-items:center;gap:6px;background:rgba(120,20,50,.55);
  border:1px solid rgba(244,63,94,.45);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;color:#fcd34d}
.brandwrap{display:flex;flex-direction:column;gap:1px;min-width:0}
.memline{display:flex;align-items:center;gap:4px;font-size:10px;color:#c9a7bd;font-weight:600}
.memline b{color:#fda4af;font-weight:800}
.memline .dot{width:5px;height:5px;border-radius:50%;background:#34d399;
  box-shadow:0 0 6px rgba(52,211,153,.9);display:inline-block}
.ondot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#34d399;
  box-shadow:0 0 8px rgba(52,211,153,.95);border:1.5px solid rgba(10,6,10,.65);
  vertical-align:middle;margin-left:2px}
.offdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#6b7280;
  border:1.5px solid rgba(10,6,10,.65);vertical-align:middle;margin-left:2px}
.bellwrap{position:relative;display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;background:rgba(120,20,50,.55);
  border:1px solid rgba(244,63,94,.45);cursor:pointer;flex:none}
.bell{font-size:15px;line-height:1}
.bnum{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;border:1.5px solid #150a14}
.nrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.07)}
.nrow.unread{background:rgba(244,63,94,.07);border-radius:10px;padding-left:8px;padding-right:8px}
.nico{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:14px;background:rgba(120,20,50,.55)}
.ntxt{flex:1;min-width:0;font-size:13px;line-height:1.4}
.nun{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ef4444;flex:none;margin-top:6px}
.tbad{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:#ef4444;color:#fff;font-size:10.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex:none}
.hbtn{background:none;border:0;color:#fb7185;font-size:16px;padding:6px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:460px;margin:0 auto;
  background:rgba(26,12,26,.95);backdrop-filter:blur(14px);border-top:1px solid rgba(244,63,94,.22);
  display:flex;justify-content:space-around;padding:8px 4px 10px}
nav button{background:none;border:0;color:#8b7286;display:flex;flex-direction:column;align-items:center;
  gap:3px;font-size:9.5px;font-weight:600;flex:1;padding:2px}
nav button.on{color:#fb7185}
nav .ico{font-size:17px;line-height:1}
.btn{border:0;border-radius:13px;padding:12px 16px;font-size:14px;font-weight:700;color:#fff;
  background:linear-gradient(90deg,var(--rose),var(--pink));width:100%;cursor:pointer;display:block}
.btn:active{opacity:.85}
.btn.ghost{background:rgba(255,255,255,.09);border:1px solid var(--line)}
.btn.soft{background:rgba(244,63,94,.16);border:1px solid rgba(244,63,94,.4);color:#fda4af}
.btn.green{background:linear-gradient(90deg,#059669,#34d399)}
.btn.amber{background:linear-gradient(90deg,#d97706,#fbbf24);color:#231000}
.btn.red{background:linear-gradient(90deg,#b91c1c,#ef4444)}
.btn.sm{padding:8px 11px;font-size:12px;border-radius:10px;width:auto}
.btn:disabled{opacity:.45}
input,select,textarea{width:100%;background:rgba(0,0,0,.45);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;color:#ffe4e6;font-size:13.5px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:rgba(244,63,94,.7)}
label.lbl{display:block;font-size:11px;font-weight:700;color:#fbbf24;margin-bottom:5px;letter-spacing:.3px}
.field{margin-bottom:10px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.h1{font-size:22px;font-weight:800;margin-bottom:4px}
.h2{font-size:14.5px;font-weight:800;color:#fda4af;margin-bottom:8px}
.sub{font-size:11.5px;color:var(--grey);line-height:1.55}
.center{text-align:center}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid rgba(244,63,94,.5);flex:none;
  background:linear-gradient(135deg,#831843,#be185d);display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#fecdd3;font-size:15px}
.card{position:relative;border-radius:22px;overflow:hidden;border:1px solid rgba(244,63,94,.22);
  box-shadow:0 14px 40px rgba(0,0,0,.5);background:#241026}
.card .photo{width:100%;height:440px;object-fit:cover;display:block;background:#2a1430}
.card .noPhoto{width:100%;height:440px;display:flex;align-items:center;justify-content:center;
  font-size:64px;font-weight:800;color:rgba(255,255,255,.14);
  background:linear-gradient(160deg,#3b1229,#5b1a3d)}
.card .grad{position:absolute;left:0;right:0;bottom:0;padding:16px 14px 14px;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.94),rgba(0,0,0,.55) 55%,transparent)}
.card .nm{font-size:21px;font-weight:800;text-shadow:0 2px 8px #000}
.card .meta{font-size:11.5px;color:#fda4af;margin-top:2px}
.card .bio{font-size:11px;color:#d1d5db;margin-top:4px;line-height:1.45}
.pillrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:999px;
  background:rgba(255,255,255,.14);color:#f5d0d9}
.pill.fake{background:rgba(251,191,36,.22);color:#fcd34d}
.pill.on{background:rgba(52,211,153,.22);color:#6ee7b7}
.acts{display:flex;align-items:center;justify-content:space-around;margin-top:12px;gap:8px}
.act{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.act.big{width:62px;height:62px;font-size:24px;background:linear-gradient(135deg,var(--rose),var(--pink));border:0}
.act.no{color:#fb7185}
.act.heart{color:#34d399}
.act.star{color:#fbbf24}
.empty{padding:44px 20px;text-align:center;color:var(--grey);font-size:13px;line-height:1.6}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:15px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09)}
.item .txt{flex:1;min-width:0}
.item .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ms{font-size:10.5px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:14px}
.modal .box{width:100%;max-width:440px;max-height:90vh;overflow-y:auto;border-radius:22px;padding:16px;
  background:rgba(30,14,30,.98);border:1px solid rgba(244,63,94,.35)}
.modal .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal .top b{font-size:16px;color:#fda4af}
.x{background:none;border:0;color:#9ca3af;font-size:22px;line-height:1;padding:0 4px}
.chat{height:calc(100vh - 260px);overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:10px}
.bub{max-width:82%;padding:8px 11px;border-radius:14px;font-size:13px;line-height:1.45;word-break:break-word}
.bub.me{align-self:flex-end;background:linear-gradient(90deg,var(--rose),var(--pink));border-bottom-right-radius:5px}
.bub.them{align-self:flex-start;background:rgba(255,255,255,.1);border-bottom-left-radius:5px}
.bub .t{display:block;font-size:9px;opacity:.6;margin-top:3px}
.typing{display:flex;gap:7px;padding:10px 0}
.typing input{flex:1}
.badge{font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(244,63,94,.25);
  color:#fda4af;text-transform:uppercase;letter-spacing:.4px}
.badge.g{background:rgba(52,211,153,.2);color:#6ee7b7}
.badge.a{background:rgba(251,191,36,.2);color:#fcd34d}
.badge.r{background:rgba(239,68,68,.22);color:#fca5a5}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.07);
  border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:#8b7286}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .rm{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.75);border:0;color:#fca5a5;
  border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}
.steps{display:flex;gap:5px;margin-bottom:14px}
.steps i{height:4px;flex:1;border-radius:2px;background:rgba(255,255,255,.15)}
.steps i.on{background:linear-gradient(90deg,var(--rose),var(--pink))}
.subnav{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px;margin-bottom:10px}
.subnav button{flex:0 1 auto;font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:999px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);color:#c9b8c6}
.subnav button.on{background:linear-gradient(90deg,var(--rose),var(--pink));color:#fff;border-color:transparent}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,.07)}
.kv span:first-child{color:var(--grey)}
.kv span:last-child{font-weight:700;text-align:right;word-break:break-word;max-width:62%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;z-index:99;max-width:88%;
  background:rgba(15,8,14,.97);border:1px solid rgba(244,63,94,.5);color:#fecdd3;
  padding:11px 16px;border-radius:13px;font-size:12.5px;font-weight:600;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.6)}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--rose);
  border-radius:50%;animation:sp .8s linear infinite;margin:26px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.gallery{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{height:auto;max-height:460px;width:auto;min-height:240px;border-radius:16px;
  object-fit:contain;background:#1d0f1d;scroll-snap-align:center;flex:none;max-width:100%;cursor:zoom-in}
.vfeed{height:calc(100vh - 190px);min-height:380px;overflow-y:auto;scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;border-radius:20px;background:#000;position:relative;
  box-shadow:0 14px 40px rgba(0,0,0,.55)}
.vfeed::-webkit-scrollbar{display:none}
.vslide{position:relative;height:100%;min-height:380px;scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;border-radius:20px}
.vslide .vv{width:100%;height:100%;object-fit:contain;background:#000}
.vslide .vbad{padding:24px;text-align:center;color:#fca5a5;font-size:13px;line-height:1.6}
.vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.5);
  border:2px solid rgba(255,255,255,.85);color:#fff;font-size:24px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  z-index:5;padding-left:4px}
.vplay.hide{display:none}
.vload{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  color:#fff;font-size:12px;background:rgba(0,0,0,.6);padding:8px 14px;
  border-radius:999px;z-index:6;display:none}
.vdead{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);
  background:rgba(20,8,18,.92);border:1px solid rgba(244,63,94,.5);border-radius:14px;
  padding:16px;text-align:center;color:#fca5a5;font-size:13px;line-height:1.6;z-index:7;display:none}
.vdead.show{display:block}
.vdead .btn{margin-top:10px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wcard{background:rgba(255,255,255,.045);border:1px solid rgba(244,63,94,.18);
  border-radius:15px;padding:8px;display:flex;flex-direction:column}
.wthumb{position:relative;width:100%;padding-top:118%;border-radius:11px;overflow:hidden;
  background:#160b14;cursor:pointer}
.wthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wno{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:800;color:rgba(255,255,255,.28)}
.wlock{position:absolute;inset:0;display:flex;flex-direction:column;gap:2px;
  align-items:center;justify-content:center;background:rgba(10,4,10,.55);
  font-size:18px;color:#fff}
.wlock span{font-size:11px;font-weight:800;color:#fcd34d}
.wplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.25);color:#fff;font-size:24px}
.won{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;
  background:#34d399;box-shadow:0 0 8px rgba(52,211,153,.95);
  border:1.5px solid rgba(10,6,10,.7)}
.wname{font-size:12.5px;font-weight:700;margin-top:6px;color:#fda4af;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtitle{font-size:10.5px;color:#9ca3af;margin-top:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.wprice{position:absolute;left:6px;bottom:6px;background:rgba(10,4,10,.78);
  color:#fcd34d;font-size:10.5px;font-weight:800;padding:3px 8px;
  border-radius:999px;border:1px solid rgba(252,211,77,.4)}
.vslide .vgrad{position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.35) 55%,transparent)}
.vslide .vmeta{position:absolute;left:14px;right:76px;bottom:16px;pointer-events:none}
.vslide .vname{font-size:16px;font-weight:800;text-shadow:0 2px 8px #000}
.vslide .vcap{font-size:12px;color:#e5e7eb;margin-top:4px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vslide .vmini{font-size:10px;color:#c4b5c0;margin-top:6px}
.vslide .vside{position:absolute;right:8px;bottom:22px;display:flex;flex-direction:column;gap:14px}
.vbtn{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;
  gap:2px;font-size:9.5px;font-weight:700;padding:0;width:64px}
.vbtn .vi{font-size:24px;line-height:1.1;text-shadow:0 2px 8px #000}
.vbtn .vn{text-shadow:0 2px 6px #000}
.vempty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:#9ca3af;font-size:13px;text-align:center;padding:24px}
.vempty .btn{width:auto}
.vtools{display:flex;gap:6px;margin-top:10px;justify-content:center;flex-wrap:wrap}
.vtools button{font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:999px;
  background:rgba(255,255,255,.08);border:1px solid var(--line);color:#e9d5e4}
.zshot{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column;
  padding:10px 10px 16px;gap:8px}
.zshot .zbar{display:flex;align-items:center;justify-content:space-between;color:#fda4af;font-size:15px}
.zpic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.zpic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;
  transition:transform .22s ease;touch-action:pinch-zoom;user-select:none}
.cmt{background:rgba(0,0,0,.35);border-radius:11px;padding:8px 10px;font-size:12px;margin-bottom:6px;line-height:1.45}
.cmt b{color:#fda4af}
.cmt .who{font-size:9.5px;color:var(--grey);margin-top:3px}
.tabs2{display:flex;gap:6px;margin-bottom:10px}
.tabs2 button{flex:1;font-size:11.5px;font-weight:700;padding:8px;border-radius:10px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);color:#c9b8c6}
.tabs2 button.on{background:rgba(244,63,94,.22);border-color:rgba(244,63,94,.6);color:#fecdd3}
.sect{margin-bottom:14px}
.warn{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:#fcd34d;
  font-size:11.5px;line-height:1.5;padding:9px 11px;border-radius:11px;margin-bottom:10px}
.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);color:#6ee7b7}
</style>
</head>
<body>

<header>
  <div class="brandwrap">
    <div class="brand">HeartSync</div>
    <div class="memline"><span class="dot"></span><b id="memVal">0</b> <span id="memWord">members</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="coinpill" onclick="openRefer()" style="cursor:pointer"><span id="coinVal">0</span> coins<span id="coinMoney"></span></div>
    <div class="bellwrap" id="btnNotif" title="Notifications" onclick="openNotifs()">
      <span class="bell">&#128276;</span>
      <span class="bnum hide" id="notifNum">0</span>
    </div>
    <button class="hbtn" id="btnRefresh" title="Refresh">&#8635;</button>
  </div>
</header>

<main id="stage" class="wrap" style="padding-top:14px"></main>

<nav id="nav" class="hide">
  <button data-tab="discover" class="on"><span class="ico">&#128293;</span>Discover</button>
  <button data-tab="videos" id="navVideos"><span class="ico">&#127916;</span>Watch</button>
  <button data-tab="chats"><span class="ico">&#128172;</span>Chats</button>
  <button data-tab="wallet"><span class="ico">&#128176;</span>Wallet</button>
  <button data-tab="me"><span class="ico">&#128100;</span>Profile</button>
  <button data-tab="admin" id="navAdmin" class="hide"><span class="ico">&#128737;</span>Admin</button>
</nav>

<script>
/* ============================================================
   HeartSync mini app - the bot is the database.
   Every call goes to this user's private API link.
   ============================================================ */
var QS = new URLSearchParams(location.search);
var API = QS.get('api') || '';
var ME = null;
var TAB = QS.get('tab') || 'discover';
var FEED = [];
var FEED_TOTAL = 0;
var WATCH = [];
var WATCH_DEFAULT = 500;
var FEED_FILTER = { category: 'All', gender: 'All' };
var OPEN_CHAT = null;
var CHAT_TIMER = null;
var ADMIN_TAB = 'stats';
var AS_PROFILE = null;
var SU = { name:'', age:'', gender:'Male', looking:'Female', category:'Dating', city:'', bio:'' };
var PICK_SLOT = 1;
var UTIMER = null;

function el(id){ return document.getElementById(id); }
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function money(n){ return Number(n || 0).toLocaleString('en-US'); }
function when(ts){
  if (!ts) return '';
  var d = new Date(Number(ts) * 1000);
  return d.toLocaleDateString(undefined,{day:'2-digit',month:'short'}) + ' ' +
         d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function initial(n){ var s = String(n || '?').trim(); return (s[0] || '?').toUpperCase(); }

function toast(msg, ms){
  var d = document.createElement('div');
  d.className = 'toast'; d.innerHTML = msg;
  document.body.appendChild(d);
  setTimeout(function(){ d.style.opacity = '0'; d.style.transition = 'opacity .3s'; }, (ms || 2600) - 300);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, ms || 2600);
}

async function post(payload){
  if (!API) throw new Error('This page must be opened from the bot.');
  var r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload || {})
  });
  if (!r.ok) throw new Error('Server error ' + r.status);
  var j = await r.json();
  if (j && j.ok === true && j.result && typeof j.result === 'object') return j.result;
  if (j && typeof j.ok !== 'undefined') return j;
  return j;
}

function setCoins(n){
  ME = ME || {};
  ME.coins = Number(n || 0);
  if (el('coinVal')) el('coinVal').textContent = money(ME.coins);
}

/* header bell: how many notifications are waiting */
/* Watch only exists once the team has published a video. Members never see an
   empty section; staff always see it so they can add the first one. */
function setWatchTab(n){
  var b = el('navVideos');
  if (!b) return;
  var show = Number(n || 0) > 0 || (ME && ME.is_admin);
  if (show) b.classList.remove('hide'); else b.classList.add('hide');
}

function setNotif(n){
  var v = Number(n || 0);
  var b = el('notifNum');
  if (!b) return;
  if (v <= 0){ b.classList.add('hide'); b.textContent = '0'; return; }
  b.classList.remove('hide');
  b.textContent = v > 99 ? '99+' : String(v);
}

/* unread count on the Chats tab, from the thread list */
function setChatBadge(n){
  var btns = document.querySelectorAll('#nav button');
  for (var i = 0; i < btns.length; i++){
    if (btns[i].getAttribute('data-tab') !== 'chats') continue;
    var old = btns[i].querySelector('.tbad');
    if (n > 0){
      if (!old){
        old = document.createElement('span');
        old.className = 'tbad';
        var ico = btns[i].querySelector('.ico');
        if (ico) ico.style.position = 'relative';
        if (ico) ico.appendChild(old);
      }
      old.textContent = n > 99 ? '99+' : String(n);
    } else if (old){
      old.parentNode.removeChild(old);
    }
    break;
  }
}

function compress(file, maxSide, quality, maxH){
  return new Promise(function(resolve){
    var img = new Image();
    var fr = new FileReader();
    fr.onload = function(e){ img.src = e.target.result; };
    img.onerror = function(){ resolve(''); };
    img.onload = function(){
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxSide / Math.max(w, h));
      if (maxH && h * scale > maxH) scale = maxH / h;
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * scale));
      c.height = Math.max(1, Math.round(h * scale));
      var ctx = c.getContext('2d');
      /* high quality downscaling: smooths instead of dropping pixels */
      try { ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; } catch(e){}
      ctx.drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    fr.readAsDataURL(file);
  });
}

/* keeps the upload under the storage limit without going back to mush */
async function compressSized(file, maxSide, maxH, quality, budget){
  var q = quality;
  var out = await compress(file, maxSide, q, maxH);
  for (var i = 0; i < 4; i++){
    if (!out || out.length <= budget) break;
    q = q - 0.13;
    if (q < 0.45) q = 0.45;
    out = await compress(file, maxSide, q, maxH);
    if (q <= 0.45) break;
  }
  return out;
}

async function uploadPhoto(file, slot, forUid){
  /* full size: what a profile card and the photo viewer show */
  var full = await compressSized(file, 1280, 1600, 0.82, 300000);
  /* small preview: it travels with every feed row, so it stays light. The card
     replaces it with the sharp version a moment after it is on screen. */
  var thumb = await compressSized(file, 320, 420, 0.62, 60000);
  if (!full || full.length < 200) throw new Error('Could not read that photo.');
  var payload = { slot: slot, full: full, thumb: thumb };
  if (forUid){ payload.action = 'a_fake_photo'; payload.uid = forUid; }
  else { payload.action = 'save_photo'; }
  return post(payload);
}

/* ---------------- boot ---------------- */
async function boot(){
  if (!API){
    var who = '';
    var inTG = false;
    try {
      if (window.Telegram && Telegram.WebApp){
        inTG = true;
        var tu = Telegram.WebApp.initDataUnsafe || {};
        if (tu.user && tu.user.first_name) who = tu.user.first_name;
      }
    } catch(e){}
    var head = inTG
      ? '<div class="h1 center" style="margin-top:10px">One tap more'
        + (who ? ', ' + esc(who) : '') + '</div>'
      : '<div class="h1 center" style="margin-top:10px">Open this from the bot</div>';
    el('stage').innerHTML = '<div class="glass" style="padding:24px">'
      + '<div style="font-size:40px;text-align:center">&#128149;</div>' + head
      + '<p class="sub center" style="margin-top:8px">This app link is private to each account, so it '
      + 'cannot be built into the shared button. Tap below and press <b>Open HeartSync</b> in the chat.</p>'
      + '<button class="btn" style="margin-top:14px" onclick="gotoBot()">&#128276; Continue in Telegram</button>'
      + '<button class="btn ghost" style="margin-top:8px" onclick="boot()">I already did, try again</button>'
      + '</div>';
    return;
  }
  spin();
  try {
    var r = await post({ action: 'boot' });
    if (!r.ok) throw new Error(r.error || 'Could not load.');
    ME = r;
    setCoins(r.coins);
    setMembers(r.members);
    setNotif(r.unread);
    setWatchTab(r.wcount);
    startPolling();
    el('nav').classList.remove('hide');
    if (r.is_admin) el('navAdmin').classList.remove('hide');
    else el('navAdmin').classList.add('hide');
    if (!r.registered){ renderWelcome(); return; }
    go(TAB);
  } catch(e){
    el('stage').innerHTML = '<div class="glass" style="padding:20px">'
      + '<div class="warn">Could not reach the server.<br>' + esc(e.message) + '</div>'
      + '<button class="btn" onclick="boot()">Try again</button></div>';
  }
}

function renderSignup(step){
  var bar = '<div class="steps">' + [1,2,3].map(function(i){
    return '<i class="' + (i <= step ? 'on' : '') + '"></i>';
  }).join('') + '</div>';
  var body = '';
  if (step === 1){
    body = '<div class="field"><label class="lbl">YOUR NAME</label>'
      + '<input id="suName" placeholder="First name" value="' + esc(SU.name) + '"></div>'
      + '<div class="field"><label class="lbl">AGE</label>'
      + '<input id="suAge" type="number" inputmode="numeric" placeholder="e.g. 24" value="' + esc(SU.age) + '"></div>'
      + '<div class="field"><label class="lbl">CITY (optional)</label>'
      + '<input id="suCity" placeholder="Kathmandu" value="' + esc(SU.city) + '"></div>'
      + '<button class="btn" onclick="suNext(2)">Continue</button>';
  }
  if (step === 2){
    body = '<div class="h2">I am a...</div><div id="gWrap">'
      + ['Male','Female','Other'].map(function(v){
          return '<button class="btn ' + (SU.gender === v ? '' : 'ghost')
            + '" style="margin-bottom:6px" onclick="pickG(this)" data-g="' + v + '">' + v + '</button>';
        }).join('') + '</div>'
      + '<div class="h2" style="margin-top:14px">I want to meet...</div><div id="lWrap">'
      + ['Female','Male','Other','All'].map(function(v){
          return '<button class="btn ' + (SU.looking === v ? '' : 'ghost')
            + '" style="margin-bottom:6px" onclick="pickL(this)" data-l="' + v + '">' + v + '</button>';
        }).join('') + '</div>'
      + '<button class="btn" style="margin-top:12px" onclick="suNext(3)">Continue</button>';
  }
  if (step === 3){
    body = '<div class="h2">What are you here for?</div>'
      + '<select id="suCat" style="margin-bottom:12px">'
      + ['Dating','Friendship','Girlfriend','Boyfriend','Chat','Marriage'].map(function(c){
          return '<option value="' + c + '"' + (SU.category === c ? ' selected' : '') + '>' + c + '</option>';
        }).join('') + '</select>'
      + '<div class="field"><label class="lbl">ABOUT YOU (optional)</label>'
      + '<textarea id="suBio" rows="3" placeholder="A line about yourself">' + esc(SU.bio) + '</textarea></div>'
      + '<div class="warn">You must be 18 or older. Your name, age, city and photos are shown to other members.</div>'
      + '<button class="btn" onclick="doSignup()" id="suBtn">Create my profile</button>';

function pickG(b){
  SU.gender = b.getAttribute('data-g');
  var w = document.querySelectorAll('#gWrap .btn');
  for (var i = 0; i < w.length; i++) w[i].className = 'btn ghost';
  b.className = 'btn';
}
function pickL(b){
  SU.looking = b.getAttribute('data-l');
  var w = document.querySelectorAll('#lWrap .btn');
  for (var i = 0; i < w.length; i++) w[i].className = 'btn ghost';
  b.className = 'btn';
}
function suNext(step){
  if (step === 2){
    SU.name = (el('suName').value || '').trim();
    SU.age = (el('suAge').value || '').trim();
    SU.city = (el('suCity').value || '').trim();
    if (SU.name.length < 2){ toast('Please write your name.'); return; }
    var a = parseInt(SU.age, 10);
    if (!a || a < 18 || a > 99){ toast('You must be 18 or older.'); return; }
  }
  renderSignup(step);
}

async function doSignup(){
  SU.category = el('suCat').value;
  SU.bio = (el('suBio').value || '').trim();
  var b = el('suBtn'); b.disabled = true; b.textContent = 'Creating...';
  try {
    var r = await post({ action:'signup', name:SU.name, age:parseInt(SU.age,10),
      gender:SU.gender, looking:SU.looking, category:SU.category, city:SU.city, bio:SU.bio });
    if (!r.ok){
      toast(esc(r.error)); b.disabled = false; b.textContent = 'Create my profile'; return;
    }
    setCoins(r.coins);
    await boot();
    toast('Profile created. You got ' + esc(r.bonus) + ' coins. Now add your photos.', 4200);
    setTimeout(function(){ go('me'); }, 500);
  } catch(e){
    toast('Could not save: ' + esc(e.message));
    b.disabled = false; b.textContent = 'Create my profile';
  }
}

/* ---------------- router ---------------- */
function go(tab){
  if (!ME || !ME.registered){ renderWelcome(); return; }
  TAB = tab;
  var btns = document.querySelectorAll('#nav button');
  for (var i = 0; i < btns.length; i++){
    if (btns[i].getAttribute('data-tab') === tab) btns[i].classList.add('on');
    else btns[i].classList.remove('on');
  }
  if (CHAT_TIMER){ clearInterval(CHAT_TIMER); CHAT_TIMER = null; }
  if (tab === 'discover') renderDiscover();
  if (tab === 'videos') renderVideos();
  if (tab === 'chats') renderChats();
  if (tab === 'wallet') renderWallet();
  if (tab === 'me') renderMe();
  if (tab === 'admin') renderAdmin();
}
document.querySelectorAll('#nav button').forEach(function(b){
  b.onclick = function(){ go(b.getAttribute('data-tab')); };
});
el('btnRefresh').onclick = function(){ boot(); };

/* ---------------- discover ---------------- */
async function renderDiscover(){
  el('stage').innerHTML = header('Discover', 'Tap a card to see everything',
      '<div style="display:flex;gap:6px;flex:none">'
      + '<button class="btn sm ghost" style="flex:none" onclick="go(\'videos\')">Videos</button>'
      + '<button class="btn sm ghost" style="flex:none" onclick="feedFilters()">Filter</button></div>')
    + '<div style="display:flex;justify-content:space-between;font-size:11px;color:#9ca3af;margin-bottom:8px">'
    + '<span>' + esc(FEED_FILTER.category) + ' / ' + esc(FEED_FILTER.gender) + '</span>'
    + '<span id="feedCount">loading...</span></div>'
    + '<div id="feedBox"></div>';
  try {
    var r = await post({ action:'feed', category: FEED_FILTER.category,
      gender: FEED_FILTER.gender, offset: 0 });
    if (!r.ok){ el('feedBox').innerHTML = '<div class="warn">' + esc(r.error) + '</div>'; return; }
    FEED = r.profiles || [];
    FEED_TOTAL = Number(r.total || 0);
    setCoins(r.coins);
    var c = el('feedCount');
    if (c){
      if (!FEED.length){
        c.textContent = 'nobody yet';
      } else if (Number(r.broadened || 0) === 1){
        /* the filter matched nothing, so the app widened it */
        c.textContent = FEED.length + ' shown - filter widened';
      } else if (Number(r.recycled || 0) === 1){
        c.textContent = FEED.length + ' shown - you have seen everyone';
      } else {
        c.textContent = FEED.length + ' of ' + FEED_TOTAL + ' profiles';
      }
    }
    drawFeed();
  } catch(e){
    el('feedBox').innerHTML = '<div class="warn">Could not load: ' + esc(e.message) + '</div>';
  }
}

/* online dot: created profiles are always online, real members by last seen */
function onDot(p){
  var on = Number(p && p.online ? 1 : 0) === 1;
  if (on) return '<span class="ondot" title="' + esc(T('online', 'Online')) + '"></span>';
  return '<span class="offdot" title="' + esc(T('offline', 'Offline')) + '"></span>';
}

/* the words beside the dot */
function statusLine(p){
  if (Number(p && p.online ? 1 : 0) === 1){
    return '<b style="color:#34d399">' + esc(T('online', 'Online')) + '</b>';
  }
  var la = Number(p && p.last ? p.last : 0);
  if (la > 0){
    return '<span style="color:#9ca3af">' + esc(T('last_seen', 'Last seen')) + ' ' + esc(when(la)) + '</span>';
  }
  return '<span style="color:#9ca3af">' + esc(T('offline', 'Offline')) + '</span>';
}

function drawFeed(){
  var box = el('feedBox');
  if (!box) return;
  if (!FEED.length){
    box.innerHTML = '<div class="empty glass" style="padding:34px 20px">'
      + '<div style="font-size:34px;margin-bottom:8px">&#128564;</div>'
      + 'No profiles match this filter yet.<br>Try another category, or check back soon.'
      + '<div style="margin-top:14px"><button class="btn ghost" onclick="feedFilters()">Change filter</button></div></div>';
    return;
  }
  var p = FEED[0];
  var img = '';
  if (p.photos > 0){
    /* this person HAS a photo, so never draw a letter: if the small preview
       did not travel with the card, upgradeCover() fetches the real one */
    img = p.thumb
      ? '<img class="photo" id="coverImg" src="' + p.thumb + '" alt="" '
        + 'style="filter:blur(2px);transform:scale(1.02);transition:filter .25s">'
      : '<div class="photo noPhoto loading" id="coverWrap"><div class="spin"></div></div>';
  } else {
    img = '<div class="noPhoto">' + esc(initial(p.name)) + '</div>';
  }
  box.innerHTML = '<div class="card" onclick="openProfile(\'' + esc(p.uid) + '\')">' + img
    + '<div class="grad">'
    + '<div class="nm">' + esc(p.name) + ', ' + esc(p.age) + ' ' + onDot(p) + '</div>'
    + '<div class="meta">' + esc(p.gender) + ' / ' + esc(p.category)
    + (p.city ? ' / ' + esc(p.city) : '') + '</div>'
    + (p.bio ? '<div class="bio">' + esc(p.bio) + '</div>' : '')
    + '<div class="pillrow"><span class="pill">' + (p.photos || 0) + ' photos</span>'
    + (p.liked ? '<span class="pill on">liked</span>' : '')
    + (p.following ? '<span class="pill on">following</span>' : '')
    + '</div></div></div>'
    + '<div class="acts">'
    + '<button class="act no" onclick="doPass(\'' + esc(p.uid) + '\')">&#10005;</button>'
    + '<button class="act star" onclick="doFollow(\'' + esc(p.uid) + '\')">&#9733;</button>'
    + '<button class="act big" onclick="openProfile(\'' + esc(p.uid) + '\')">&#128065;</button>'
    + '<button class="act heart" onclick="doLike(\'' + esc(p.uid) + '\')">&#9829;</button>'
    + '</div>'
    + '<div class="row" style="margin-top:10px">'
    + '<button class="btn soft" onclick="startChat(\'' + esc(p.uid) + '\')">Message / '
    + esc(ME.settings ? ME.settings.msg_price : 5) + '</button>'
    + '<button class="btn ghost" onclick="openProfile(\'' + esc(p.uid) + '\')">Comment</button>'
    + '</div>'
    + (FEED.length > 1 ? '<p class="sub center" style="margin-top:10px">' + FEED.length
        + ' waiting - skip or like this one to move on</p>' : '');
  upgradeCover(p);
}

/* the light preview shows at once, the sharp version replaces it a moment later.
   Also the rescue path: when a card arrived with no preview at all, this asks
   for the real photo so a member with pictures is never shown as a letter. */
async function upgradeCover(p){
  if (!p || !p.uid) return;
  if (!p.photos && !p.slot) return;
  var slot = p.slot || 1;
  try {
    var r = await post({ action:'img', uid:p.uid, slot:slot, size:'f' });
    if (!r || !r.ok || !r.data) return;
    var n = el('coverImg');
    if (!n){
      var wrap = el('coverWrap');
      if (!wrap) return;
      if (FEED[0] !== p) return;
      wrap.className = 'photo';
      wrap.innerHTML = '<img class="photo" id="coverImg" alt="" style="width:100%;height:100%;object-fit:cover">';
      n = el('coverImg');
      if (!n) return;
    }
    if (FEED[0] !== p) return;
    n.onload = function(){
      n.style.filter = 'none';
      n.style.transform = 'none';
    };
    /* the picture really is not there: show the letter instead of a dark box */
    n.onerror = function(){
      var card = n.parentNode;
      if (card) card.innerHTML = '<div class="noPhoto">' + esc(initial(p.name)) + '</div>';
    };
    n.src = r.data;
    if (n.complete && n.naturalWidth > 0){ n.style.filter = 'none'; n.style.transform = 'none'; }
  } catch(e){}
}

function feedFilters(){
  var cats = ['All','Dating','Friendship','Girlfriend','Boyfriend','Chat','Marriage'];
  var gens = ['All','Female','Male','Other'];
  openModal('<div class="h2">Category</div><div id="fc">'
    + cats.map(function(c){
        return '<button class="btn ' + (FEED_FILTER.category === c ? '' : 'ghost')
          + '" style="margin-bottom:6px" data-v="' + c + '" onclick="setF(\'category\',this)">' + c + '</button>';
      }).join('') + '</div>'
    + '<div class="h2" style="margin-top:12px">Show me</div><div id="fg">'
    + gens.map(function(g){
        return '<button class="btn ' + (FEED_FILTER.gender === g ? '' : 'ghost')
          + '" style="margin-bottom:6px" data-v="' + g + '" onclick="setF(\'gender\',this)">' + g + '</button>';
      }).join('') + '</div>'
    + '<button class="btn" style="margin-top:12px" onclick="closeModal();renderDiscover()">Show profiles</button>');
}
function setF(kind, b){
  FEED_FILTER[kind] = b.getAttribute('data-v');
  var wrap = el(kind === 'category' ? 'fc' : 'fg');
  if (!wrap) return;
  var all = wrap.querySelectorAll('.btn');
  for (var i = 0; i < all.length; i++) all[i].className = 'btn ghost';
  b.className = 'btn';
}

async function doLike(uid){
  try {
    var r = await post({ action:'like', uid:uid });
    if (!r.ok){ toast(esc(r.error)); return; }
    toast(r.mutual ? 'It is a match - they liked you too!' : 'Liked!');
    FEED = FEED.filter(function(x){ return x.uid !== uid; });
    drawFeed();
  } catch(e){ toast('Failed: ' + esc(e.message)); }
}
async function doPass(uid){
  try {
    await post({ action:'pass', uid:uid });
    FEED = FEED.filter(function(x){ return x.uid !== uid; });
    drawFeed();
  } catch(e){ toast('Failed: ' + esc(e.message)); }
}
async function doFollow(uid){
  var p = null;
  for (var i = 0; i < FEED.length; i++) if (FEED[i].uid === uid) p = FEED[i];
  var on = p && p.following;

/* tapping the picture or the play button starts the clip */
function wireSlides(){
  var vids = document.querySelectorAll('.vslide video');
  for (var i = 0; i < vids.length; i++){
    (function(v){
      /* wire each clip once, or a second tap would cancel the first */
      if (v.getAttribute('data-wired') === '1') return;
      v.setAttribute('data-wired', '1');
      var slide = v.parentNode;
      v.addEventListener('error', function(){ vDead(v, true); });
      v.addEventListener('stalled', function(){ vBusy(v, true); });
      v.addEventListener('waiting', function(){ vBusy(v, true); });
      v.addEventListener('canplay', function(){ vBusy(v, false); });
      v.addEventListener('playing', function(){
        vBusy(v, false);
        vDead(v, false);
        vPlayBtn(v, false);
      });
      v.addEventListener('pause', function(){
        if (Number(v.currentTime || 0) > 0) vPlayBtn(v, true);
      });
      v.onclick = function(){ toggleVid(v); };
      if (slide){
        var b = slide.querySelector('.vplay');
        if (b) b.onclick = function(ev){
          if (ev && ev.stopPropagation) ev.stopPropagation();
          toggleVid(v);
        };
      }
    })(vids[i]);
  }
}

/* give a clip its real source if it does not have one yet */
function applySrc(v){
  if (!v) return;
  var cur = v.getAttribute('src');
  if (cur && cur !== '') return;
  var src = String(v.getAttribute('data-src') || '');
  if (src === '') return;
  v.setAttribute('src', src);
  try { v.load(); } catch(e){}
}

function vOf(id){
  var s = document.querySelector('.vslide[data-id="' + id + '"]');
  return s ? s.querySelector('video') : null;
}
function vBusy(v, on){
  var s = v.parentNode; if (!s) return;
  var n = s.querySelector('.vload');
  if (n) n.style.display = on ? 'block' : 'none';
}
function vDead(v, on){
  var s = v.parentNode; if (!s) return;
  var n = s.querySelector('.vdead');
  if (n) { if (on) n.classList.add('show'); else n.classList.remove('show'); }
  var l = s.querySelector('.vload');
  if (l && on) l.style.display = 'none';
}
function vPlayBtn(v, on){
  var s = v.parentNode; if (!s) return;
  var n = s.querySelector('.vplay');
  if (!n) return;
  if (on) n.classList.remove('hide'); else n.classList.add('hide');
}

function toggleVid(v){
  if (!v) return;
  if (!v.paused){ v.pause(); vPlayBtn(v, true); return; }
  vDead(v, false);
  /* the source is only put on the element when it is first played, so a screen
     full of clips does not download everything at once. Without this line the
     element has a poster but no video at all, which is exactly the
     "picture shows, nothing plays" symptom. */
  applySrc(v);
  /* a tap should give sound; if the phone refuses sound until it has been
     touched again, fall back to muted so it still plays */
  v.muted = false;
  var p = null;
  try { p = v.play(); } catch(e){ p = null; }
  if (p && p.catch){
    p.catch(function(){
      v.muted = true;
      try { v.play(); } catch(e4){}
    }).then(function(){
      if (v.paused){
        try { v.load(); } catch(e2){}
        v.muted = true;
        var q = null;
        try { q = v.play(); } catch(e3){ q = null; }
        if (q && q.catch) q.catch(function(){ vDead(v, true); });
      }
    });
  }
}

function vRetry(id){
  var v = vOf(id);
  if (!v) return;
  var src = String(v.getAttribute('data-src') || '');
  if (src === '') return;
  vBusy(v, true);
  vDead(v, false);
  /* ask for the file again instead of reusing the attempt that failed */
  v.setAttribute('src', src + (src.indexOf('?') >= 0 ? '&' : '?') + 'r=' + Date.now());
  try { v.load(); } catch(e){}
  toggleVid(v);
}

function vOpenLink(id){
  var v = findVid(id);
  if (!v || !v.url){ toast('No link for this video.'); return; }
  var w = null;
  try { w = window.open(v.url, '_blank'); } catch(e){ w = null; }
  if (!w){ try { location.href = v.url; } catch(e2){ toast('Use Share to copy the link.'); } }
}

function observeSlides(){
  if (!VID.obs){
    VID.obs = new IntersectionObserver(function(rows){
      for (var i = 0; i < rows.length; i++){
        var e = rows[i];
        var v = e.target.querySelector('video');
        if (!v) continue;
        if (e.intersectionRatio >= 0.55){
          /* scrolling onto a clip must give it its source too */
          applySrc(v);
          try {
            var p = v.play();
            if (p && p.catch) p.catch(function(){});
          } catch(err){}
        } else {
          try { v.pause(); } catch(err){}
        }
      }
    }, { threshold: [0, 0.55] });
  }
  var all = document.querySelectorAll('.vslide');
  for (var i = 0; i < all.length; i++){
    if (all[i].getAttribute('data-obs') !== '1'){
      all[i].setAttribute('data-obs', '1');
      VID.obs.observe(all[i]);
    }
  }
}

async function vMore(){
  if (VID.busy) return;
  if (!VID.next || VID.next <= 0) return;
  VID.busy = true;
  try {
    var r = await post({ action:'vids', offset:VID.next, only:VID.only });
    if (r && r.ok && r.videos && r.videos.length){
      var box = el('vfeed');
      var have = {};
      for (var j = 0; j < VID.list.length; j++) have[VID.list[j].id] = 1;
      var fresh = 0;
      for (var i = 0; i < r.videos.length; i++){
        if (have[r.videos[i].id]) continue;
        have[r.videos[i].id] = 1;
        VID.list.push(r.videos[i]);
        box.insertAdjacentHTML('beforeend', slideHtml(r.videos[i]));
        fresh = fresh + 1;
      }
      var told = r.next || 0;
      /* nothing new came back: stop asking, or the same batch repeats */
      if (fresh === 0 || told <= VID.next) VID.next = 0;
      else VID.next = told;
      if (fresh > 0){
        /* new clips need the play button wired too, or they never start */
        wireSlides();
        observeSlides();
      }
    } else {
      VID.next = 0;
    }
  } catch(e){ VID.next = 0; }
  VID.busy = false;
}

async function vLike(btn, id){
  try {
    var r = await post({ action:'vlike', id:id });
    if (!r.ok){ toast(esc(r.error)); return; }
    var v = findVid(id);

function vPick(inp){
  var f = inp.files[0];
  if (!f) return;
  if (!videoKind(f)){
    vNote('That file is not a video. Pick an mp4, mov, mkv, webm or avi file.');
    inp.value = '';
    return;
  }
  if (f.size > VID_MAX){
    vNote('That file is ' + Math.round(f.size / 1048576) + ' MB. The limit is '
      + Math.round(VID_MAX / 1048576) + ' MB.');
    inp.value = '';
    return;
  }
  VIDEO_FILE = f;
  vNote('Selected: ' + (f.name || 'video') + ' · ' + Math.max(1, Math.round(f.size / 1048576)) + ' MB. Press Post it.');
  try {
    var url = URL.createObjectURL(f);
    var v = document.createElement('video');
    v.preload = 'metadata';
    v.muted = true;
    v.src = url;
    v.onloadedmetadata = function(){
      VIDEO_DUR = Math.round(v.duration || 0);
      try { v.currentTime = Math.min(1, (v.duration || 2) / 3); } catch(e){}
    };
    v.onseeked = function(){
      try {
        var w = v.videoWidth, h = v.videoHeight;
        if (!w || !h) return;
        var sc = Math.min(1, 420 / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * sc);
        c.height = Math.round(h * sc);
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        var p = c.toDataURL('image/jpeg', 0.55);
        if (p.length < 90000){
          VIDEO_POSTER = p;
          var b = el('vCoverBox');
          if (b) b.innerHTML = '<img src="' + p + '" style="width:100%;border-radius:12px">';
        }
      } catch(e){}
    };
  } catch(e){}
}

async function vCoverPick(inp){
  var f = inp.files[0];
  if (!f) return;
  var p = await compressSized(f, 480, 640, 0.6, 80000);
  if (p && p.length < 90000){
    VIDEO_POSTER = p;
    var b = el('vCoverBox');
    if (b) b.innerHTML = '<img src="' + p + '" style="width:100%;border-radius:12px">';
  } else {

}

var VID_MAX = 60 * 1048576;

function videoKind(f){
  var t = String(f.type || '').toLowerCase();
  var n = String(f.name || '').toLowerCase();
  if (t.indexOf('video/') === 0) return true;
  var ext = ['.mp4','.mov','.m4v','.mkv','.webm','.avi','.flv','.3gp','.3g2','.mpg',
             '.mpeg','.ts','.m2ts','.wmv','.ogv','.divx','.f4v'];
  for (var i = 0; i < ext.length; i++){
    if (n.length > ext[i].length && n.slice(-ext[i].length) === ext[i]) return true;
  }
  return false;
}

/* one free host, tried in order by the chain below. No key, no account. */
function hostPost(cfg, file, prog){
  return new Promise(function(resolve, reject){
    var fd = new FormData();
    var keys = Object.keys(cfg.fields);
    for (var i = 0; i < keys.length; i++) fd.append(keys[i], cfg.fields[keys[i]]);
    fd.append(cfg.fileField, file, (file.name || 'video.mp4'));
    var xhr = new XMLHttpRequest();
    xhr.open('POST', cfg.url, true);
    xhr.upload.onprogress = function(e){
      if (e.lengthComputable && prog) prog(Math.round(e.loaded * 100 / e.total));
    };
    xhr.onload = function(){
      var raw = String(xhr.responseText || '').trim();
      var u = '';
      try {
        if (cfg.json){
          var j = JSON.parse(raw);
          u = String(cfg.pick(j) || '');
        } else {
          u = raw;
        }
      } catch(e2){ u = ''; }
      if (u.indexOf('http') === 0 && u.length < 400){ resolve(u); return; }
      reject(new Error(cfg.name + ' refused that file'));
    };
    xhr.onerror = function(){ reject(new Error(cfg.name + ' unreachable')); };
    xhr.ontimeout = function(){ reject(new Error(cfg.name + ' timed out')); };
    xhr.timeout = 300000;
    xhr.send(fd);
  });
}

/* Only hosts that KEEP the file and serve it as a playable video are listed.
   Temporary hosts are deliberately excluded: a clip that uploads fine and then
   expires an hour later is worse than an upload that fails honestly now. */
var VID_HOSTS = [
  { name: 'Catbox', url: 'https://catbox.moe/user/api.php', fileField: 'fileToUpload',
    fields: { reqtype: 'fileupload' }, json: false },
  { name: '0x0.st', url: 'https://0x0.st', fileField: 'file',
    fields: {}, json: false }
];

/* Can this browser actually play that address? This is the only honest test:
   a host can accept an upload and still serve it as a download, which looks
   like a picture that never plays. */
function canPlayUrl(url, ms){
  return new Promise(function(resolve){
    var v = document.createElement('video');
    var done = false;
    var timer = null;
    function finish(ok){
      if (done) return;
      done = true;
      if (timer) clearTimeout(timer);
      try { v.removeAttribute('src'); v.load(); } catch(e){}
      resolve(ok);
    }
    v.muted = true;
    v.setAttribute('playsinline', '');
    v.preload = 'metadata';
    v.onloadedmetadata = function(){ finish(true); };
    v.onloadeddata = function(){ finish(true); };
    v.onerror = function(){ finish(false); };
    timer = setTimeout(function(){ finish(false); }, ms || 15000);
    v.src = url;
    try { v.load(); } catch(e){ finish(false); }
  });
}

/* tries every free host until one gives back a link this phone can play */
function uploadVideo(file, prog){
  var errs = [];
  function attempt(i){
    if (i >= VID_HOSTS.length){
      return Promise.reject(new Error('No host gave a playable video ('
        + errs.join('; ') + '). Try a shorter clip, or use an mp4 file.'));
    }
    var host = VID_HOSTS[i];
    return hostPost(host, file, prog).then(function(u){
      if (prog) prog(100);
      return canPlayUrl(u).then(function(ok){
        if (ok) return u;
        errs.push(host.name + ' link not playable');
        if (prog) prog(0);
        return attempt(i + 1);
      });
    }).catch(function(e){
      errs.push(e.message);
      if (prog) prog(0);
      return attempt(i + 1);
    });
  }
  return attempt(0);
}

/* optional host the owner can set in Admin > Settings (imgur client id) */
function uploadToCloud(cid, file){
  return new Promise(function(resolve, reject){
    var fd = new FormData();
    fd.append('video', file);
    fetch('https://api.imgur.com/3/image', {
      method: 'POST',
      headers: { 'Authorization': 'Client-ID ' + cid },
      body: fd
    }).then(function(r){ return r.json(); }).then(function(j){
      var d = (j && j.data) ? j.data : {};
      if (d.mp4){ resolve(d.mp4); return; }
      if (d.link){ resolve(d.link); return; }
      reject(new Error('The video host refused it. Try a shorter clip or paste a link.'));
    }).catch(function(){
      reject(new Error('Upload failed. Paste a video link instead.'));
    });
  });
}

async function vSubmit(){
  var url = (el('vUrl').value || '').trim();
  var cap = (el('vCap').value || '').trim();
  var b = el('vGo');
  b.disabled = true;
  b.textContent = 'Posting...';
  try {
    if (!url && VIDEO_FILE){
      if (VIDEO_FILE.size > VID_MAX){
        vNote('That file is ' + Math.round(VIDEO_FILE.size / 1048576) + ' MB. The limit is '
          + Math.round(VID_MAX / 1048576) + ' MB. Use a shorter clip or paste a video link.');
        b.disabled = false;
        b.textContent = 'Post it';
        return;
      }
      b.textContent = 'Uploading... 0%';
      var prog = function(p){
        var bb = el('vGo');
        if (bb) bb.textContent = 'Uploading... ' + p + '%';
      };
      try {
        url = VID.cloud ? await uploadToCloud(VID.cloud, VIDEO_FILE)
                        : await uploadVideo(VIDEO_FILE, prog);
      } catch(e2){
        vNote(String(e2.message || 'Upload failed. Paste a video link instead.'));
        b.disabled = false;
        b.textContent = 'Post it';
        return;
      }
    }
    if (!url){
      vNote('Choose a video from your phone or paste a link first.');
      b.disabled = false;
      b.textContent = 'Post it';
      return;
    }
    /* a pasted link must be checked too: a page link or an expired file
       would post fine and then never play for anybody */
    b.textContent = 'Checking the video...';
    var playable = await canPlayUrl(url, 15000);
    if (!playable){
      vNote('That address will not play as a video on a phone. Use a direct '
        + 'mp4 link (it must end in .mp4), or pick the file from your phone instead.');
      b.disabled = false;
      b.textContent = 'Post it';
      return;
    }
    b.textContent = 'Posting...';
    var r = await post({ action:'vpost', url:url, cap:cap,
      poster:VIDEO_POSTER || '', dur:VIDEO_DUR || 0 });
    if (!r.ok){
      vNote(r.error);
      b.disabled = false;
      b.textContent = 'Post it';
      return;
    }
    VIDEO_FILE = null; VIDEO_POSTER = ''; VIDEO_DUR = 0;
    closeModal();
    toast('Posted. It is at the top of Videos.', 3600);
    renderVideos();
  } catch(e){
    vNote('Failed: ' + e.message);
    b.disabled = false;
    b.textContent = 'Post it';
  }
}

async function openChat(uid){
  OPEN_CHAT = uid;
  TAB = 'chats';
  var btns = document.querySelectorAll('#nav button');
  for (var i = 0; i < btns.length; i++){
    if (btns[i].getAttribute('data-tab') === 'chats') btns[i].classList.add('on');

    + '<button class="btn sm ghost" style="flex:none" onclick="go(\'chats\')">&larr;</button>'
    + '<div id="chatHead" class="h2" style="margin:0">Chat</div></div>'
    + '<div class="glass" style="padding:0;overflow:hidden">'
    + '<div class="chat" id="chatBox"><div class="spin"></div></div>'
    + '<div class="typing" style="padding:8px;border-top:1px solid rgba(255,255,255,.1)">'
    + '<input id="chatTxt" placeholder="Write a message..." style="flex:1">'

    + '</div></div><p class="sub center" style="margin-top:8px" id="chatPrice"></p>';
  el('chatTxt').addEventListener('keydown', function(e){ if (e.key === 'Enter') sendMsg(); });
  await loadChat();
  if (CHAT_TIMER) clearInterval(CHAT_TIMER);
  // silent refresh: new bubbles appear without the screen flickering
  CHAT_TIMER = setInterval(function(){ loadChat(true); }, 3000);
}

async function loadChat(silent){
  if (!OPEN_CHAT) return;
  try {
    var r = await post({ action:'chat', uid:OPEN_CHAT });
    if (!r.ok) return;
    setCoins(r.coins);
    if (el('chatHead')) el('chatHead').textContent = r.name;
    if (el('chatPrice')) el('chatPrice').textContent = 'Each message you send costs ' + r.msg_price + ' coins.';
    var box = el('chatBox');
    if (!box) return;
    var msgs = r.messages || [];
    // nothing new and nothing missing: leave the screen exactly as it is, so
    // the chat never flickers or jumps while you are reading or typing
    if (silent && msgs.length === box.querySelectorAll('.bub').length) return;
    if (!msgs.length){
      box.innerHTML = '<div class="empty" style="padding:26px 12px">Say hello to ' + esc(r.name) + '.</div>';
    } else {
      box.innerHTML = msgs.map(function(m){
        return '<div class="bub ' + (m.me ? 'me' : 'them') + '">' + esc(m.txt)
          + '<span class="t">' + when(m.ts) + '</span></div>';
      }).join('');
      box.scrollTop = box.scrollHeight;
    }
  } catch(e){}
}

async function sendMsg(){
  var inp = el('chatTxt');
  var t = (inp.value || '').trim();
  if (!t || !OPEN_CHAT) return;
  inp.value = '';
  // show the bubble at once, so sending never feels slow
  var box = el('chatBox');
  if (box){
    var empty = box.querySelector('.empty');
    if (empty) box.innerHTML = '';
    var d = document.createElement('div');
    d.className = 'bub me';
    d.innerHTML = esc(t) + '<span class="t">sending...</span>';
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }
  try {
    var r = await post({ action:'send', uid:OPEN_CHAT, text:t });
    if (!r.ok){ toast(esc(r.error)); inp.value = t; loadChat(); return; }
    setCoins(r.coins);
    await loadChat();
  } catch(e){
    toast('Failed: ' + esc(e.message));
    inp.value = t;
    loadChat();
  }

async function submitDeposit(){
  var amt = parseInt(el('depAmt').value || '0', 10);
  var method = el('depMethod').value;
  var ref = (el('depRef').value || '').trim();
  var file = el('depShot').files[0];
  if (!amt || amt < 10){ toast('Enter the amount you paid.'); return; }
  if (!file){ toast('Please attach the payment screenshot.'); return; }
  var b = el('depBtn'); b.disabled = true; b.textContent = 'Uploading...';
  try {
    var shot = await compress(file, 900, 0.6);
    if (!shot || shot.length < 200) throw new Error('Could not read that photo.');
    var r = await post({ action:'deposit_req', amount:amt, method:method, ref:ref, photo:shot });
    if (!r.ok){
      toast(esc(r.error)); b.disabled = false; b.textContent = 'Send for approval'; return;
    }
    toast('Sent for approval. You will get a Telegram message when it is confirmed.', 4200);
    renderWallet();
  } catch(e){
    toast('Failed: ' + esc(e.message));
    b.disabled = false; b.textContent = 'Send for approval';
  }
}

async function submitStars(){
  var amt = parseInt(el('starAmt').value || '0', 10);
  if (!amt || amt < 10){ toast(T('enter_amount', 'Enter the amount of coins you want.')); return; }
  if (amt % 10 !== 0){ toast(T('round_10', 'Use a number in steps of 10, for example 100.')); return; }
  var b = el('starBtn'); b.disabled = true; b.textContent = '...';
  try {
    var r = await post({ action:'deposit_stars', amount:amt });
    if (!r.ok){
      toast(esc(r.error)); b.disabled = false;
      b.textContent = T('pay_with_stars_btn', 'Pay with Stars'); return;
    }
    toast('⭐ ' + r.stars + ' Stars for ' + r.coins + ' coins. Confirm in Telegram.', 5000);
    try {
      if (window.Telegram && Telegram.WebApp && Telegram.WebApp.close){
        setTimeout(function(){ Telegram.WebApp.close(); }, 1200);
      }
    } catch(e){}
    b.disabled = false;
    b.textContent = T('pay_with_stars_btn', 'Pay with Stars');
  } catch(e){
    toast('Failed: ' + esc(e.message));
    b.disabled = false; b.textContent = T('pay_with_stars_btn', 'Pay with Stars');
  }
}

async function submitWithdraw(){
  var amt = parseInt(el('wdAmt').value || '0', 10);
  var acct = (el('wdAcct').value || '').trim();
  var method = el('wdMethod').value;
  if (!amt){ toast('Enter an amount.'); return; }
  if (!acct){ toast('Enter where to send the payout.'); return; }
  var b = el('wdBtn'); b.disabled = true; b.textContent = 'Sending...';
  try {
    var r = await post({ action:'withdraw_req', amount:amt, account:acct, method:method });
    if (!r.ok){
      toast(esc(r.error)); b.disabled = false; b.textContent = 'Request withdrawal'; return;
    }
    setCoins(r.coins);
    toast('Withdrawal requested. The admin will pay it.', 4200);
    renderWallet();
  } catch(e){
    toast('Failed: ' + esc(e.message));
    b.disabled = false; b.textContent = 'Request withdrawal';
  }
}

async function pickPhoto(inp){

function searchUsers(){
  if (UTIMER) clearTimeout(UTIMER);

    if (el('uq')) loadUsers(el('uq').value.trim());

}

async function loadUsers(q){
  var box = el('uList');
  if (!box) return;
  try {
    var r = await post({ action:'a_users', q:q });
    if (!r.ok){ box.innerHTML = '<div class="warn">' + esc(r.error) + '</div>'; return; }
    var rows = r.users || [];
    box.innerHTML = rows.length ? '<div class="list">' + rows.map(function(u){
        return '<div class="item" onclick="userDetail(\'' + esc(u.uid) + '\')">'
          + '<div class="avatar">' + esc(initial(u.name)) + '</div>'
          + '<div class="txt"><div class="nm">' + esc(u.name) + ', ' + esc(u.age)
          + (u.fake ? ' <span class="badge a">vip</span>' : '')
          + (u.banned ? ' <span class="badge r">ban</span>' : '') + '</div>'
          + '<div class="ms">' + esc(u.gender) + ' / ' + money(u.coins) + ' coins / '
          + esc(u.photos) + ' photos</div></div></div>';
      }).join('') + '</div>' : '<div class="empty glass">No member found.</div>';
  } catch(e){ box.innerHTML = '<div class="warn">' + esc(e.message) + '</div>'; }
}

async function saveAdminGeo(uid){
  try {
    var r = await post({ action:'a_user_op', uid:uid, op:'country',
      country: el('auCountry').value, search_country: el('auLook').value });
    if (!r.ok){ toast(esc(r.error)); return; }
    var c = await post({ action:'a_user_op', uid:uid, op:'user_currency',
      currency: el('auCur').value });
    if (!c.ok){ toast(esc(c.error)); return; }
    toast('Saved.');
    closeModal();
    if (el('uq')) loadUsers(el('uq').value);
  } catch(e){ toast(esc(e.message)); }
}

async function giveCoins(uid){
  var v = prompt('How many coins to add? Use a minus sign to take away.', '100');
  if (v === null) return;
  var n = parseInt(v, 10);
  if (!n){ toast('Enter a number.'); return; }
  try {
    var r = await post({ action:'a_user_op', uid:uid, op:'coins', value:n });
    if (!r.ok){ toast(esc(r.error)); return; }
    toast('Balance is now ' + money(r.coins) + ' coins.');
    closeModal();
  } catch(e){ toast(esc(e.message)); }
}
async function toggleBan(uid, banned){
  try {
    var r = await post({ action:'a_user_op', uid:uid, op: banned ? 'unban' : 'ban' });
    if (!r.ok){ toast(esc(r.error)); return; }
    toast(r.banned ? 'Banned.' : 'Unbanned.');
    closeModal();
    if (el('uq')) loadUsers(el('uq').value);
  } catch(e){ toast(esc(e.message)); }
}

    + cats + '</select></div></div>'

    + '<button class="btn" onclick="saveFake(\'' + esc(p.uid) + '\')">Save profile</button>' + extra);

/* ============ language / country / currency extension ============ */
var LANG = 'en', I18N = {}, EN = {}, DOM_MAP = {}, COUNTRIES = [], CURRENCIES = [], MYCUR = 'USD';
var OBS = null, BUSY = false, NAVDONE = false;

function T(key, fb){ var v = I18N[key] || EN[key] || fb; return v ? v : ''; }

function buildDomMap(){
  DOM_MAP = {};
  for (var k in EN){
    var e = EN[k], d = I18N[k] || e;
    if (e) DOM_MAP[String(e).toLowerCase()] = d;
  }
}

function translateDom(){
  if (BUSY || LANG === 'en') return;
  BUSY = true;
  try {
    var walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    var n = walk.nextNode();
    while (n){
      var key = String(n.nodeValue || '').trim().toLowerCase();
      if (key && DOM_MAP[key] && DOM_MAP[key] !== n.nodeValue) n.nodeValue = DOM_MAP[key];
      n = walk.nextNode();
    }
    var ins = document.querySelectorAll('input[placeholder]');
    for (var i = 0; i < ins.length; i++){
      var pk = String(ins[i].getAttribute('placeholder') || '').toLowerCase();
      if (DOM_MAP[pk]) ins[i].setAttribute('placeholder', DOM_MAP[pk]);
    }
  } catch(e){}
  BUSY = false;
}

function watchDom(){
  if (OBS || !window.MutationObserver) return;
  OBS = new MutationObserver(function(){
    if (BUSY) return;
    setTimeout(translateDom, 80);
  });
  OBS.observe(el('stage'), { childList: true, subtree: true });
}

  payload = payload || {};

    payload.country = FEED_FILTER.country || 'All';
  }
  if (a === 'signup' || a === 'save_profile'){
    if (payload.country === undefined && SU.country) payload.country = SU.country;
    if (payload.search_country === undefined && SU.search_country) payload.search_country = SU.search_country;
    if (payload.currency === undefined) payload.currency = MYCUR;
    if (payload.lang === undefined) payload.lang = LANG;
  }
  var r = await _post(payload);
  if (a === 'boot' && r && r.ok){
    MYCUR = r.currency || 'USD';
    LANG = r.lang || 'en';

var DAILY_SHOWN = false;

function waitText(sec){
  var s = Number(sec || 0);
  if (s <= 0) return '';
  var h = Math.floor(s / 3600);
  var m = Math.floor((s % 3600) / 60);
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}

function maybeDaily(r){
  if (!r || !r.daily || !ME || !ME.registered) return;
  if (r.daily.ready !== 1) return;
  if (r.daily.bonus < 1) return;
  if (DAILY_SHOWN) return;
  DAILY_SHOWN = true;
  var old = el('dailyBar');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  var d = document.createElement('div');
  d.id = 'dailyBar';
  d.className = 'glass';
  /* fixed, so drawing another tab can never erase it */
  d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);'
    + 'top:58px;width:calc(100% - 28px);max-width:432px;z-index:45;padding:12px 14px;'
    + 'border-color:rgba(251,191,36,.55);background:rgba(40,26,10,.97)';
  d.innerHTML = '<div style="display:flex;align-items:center;gap:10px">'
    + '<div style="font-size:24px">&#127873;</div>'
    + '<div style="flex:1;min-width:0"><div style="font-weight:800;color:#fcd34d;font-size:13px">'
    + esc(r.daily.bonus) + ' ' + esc(T('coins', 'coins')) + '</div>'
    + '<div class="sub" style="font-size:10.5px">'
    + esc(T('daily_ready', 'Your daily login bonus is ready.')) + '</div></div>'
    + '<button class="btn sm" style="flex:none" onclick="claimDaily(this)">'
    + esc(T('claim', 'Claim')) + '</button>'
    + '<button class="x" style="flex:none;font-size:18px" onclick="hideDaily()">&times;</button>'
    + '</div>';
  document.body.appendChild(d);
}

function hideDaily(){
  var d = el('dailyBar');
  if (d && d.parentNode) d.parentNode.removeChild(d);
}

async function claimDaily(btn){
  if (btn){ btn.disabled = true; btn.textContent = '...'; }
  try {
    var r = await _post({ action: 'claim_daily' });
    if (!r.ok){
      if (r.wait) toast('Already claimed. Come back in ' + waitText(r.wait) + '.');
      else toast(esc(r.error));
      if (btn){ btn.disabled = false; btn.textContent = 'Claim'; }
      return;
    }
    setCoins(r.coins);
    toast('🎁 +' + r.bonus + ' ' + T('coins', 'coins') + '. ' + money(r.coins), 3600);
    hideDaily();
  } catch(e){
    toast('Failed: ' + esc(e.message));
    if (btn){ btn.disabled = false; btn.textContent = 'Claim'; }
  }
}

async function loadNetworkCounts(){
  var box = el('netCounts');
  if (!box) return;
  try {
    var r = await _post({ action: 'network' });
    if (!r.ok) return;
    box.innerHTML = esc(T('following_count', 'Following')) + ': <b>' + r.following_count
      + '</b> &middot; ' + esc(T('liked_count', 'Likes received')) + ': <b>'
      + r.liked_me_count + '</b>';
  } catch(e){}
}

async function openNetwork(kind){
  openModal('<div class="spin"></div>');
  try {
    var r = await _post({ action: 'network' });
    if (!r.ok){ closeModal(); toast(esc(r.error)); return; }
    var rows = kind === 'following' ? (r.following || []) : (r.liked_me || []);
    var title = kind === 'following' ? T('who_i_follow', 'Who I follow')
                                     : T('who_liked_me', 'Who liked me');
    var body = '';
    if (!rows.length){
      body = '<div class="empty">' + esc(T('nobody_yet', 'Nobody yet.')) + '</div>';
    } else {
      body = '<div class="list">' + rows.map(function(p){
        var av = p.thumb ? '<img class="avatar" src="' + p.thumb + '">'
                         : '<div class="avatar">' + esc(initial(p.name)) + '</div>';
        var act = '';
        if (kind === 'following'){
          act = '<button class="btn sm ghost" style="flex:none" onclick="unfollowFrom(\''
            + esc(p.uid) + '\')">' + esc(T('unfollow', 'Unfollow')) + '</button>';
        } else {
          act = '<button class="btn sm" style="flex:none" onclick="likeBack(\''
            + esc(p.uid) + '\')">♥</button>';
        }
        return '<div class="item"><div onclick="closeModal();openProfile(\'' + esc(p.uid) + '\')"'
          + ' style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">' + av
          + '<div class="txt"><div class="nm">' + esc(p.name) + ', ' + esc(p.age) + '</div>'
          + '<div class="ms">' + esc(p.gender) + (p.country ? ' / ' + esc(p.country) : '')
          + (p.city ? ' / ' + esc(p.city) : '') + '</div></div></div>' + act + '</div>';
      }).join('') + '</div>';
    }
    openModal('<div class="h2">' + esc(title) + ' (' + rows.length + ')</div>' + body);
    translateDom();
  } catch(e){ closeModal(); toast(esc(e.message)); }
}

async function unfollowFrom(uid){
  try {
    var r = await _post({ action: 'unfollow', uid: uid });
    if (!r.ok){ toast(esc(r.error)); return; }
    toast(esc(T('unfollowed', 'Unfollowed')));
    openNetwork('following');
    loadNetworkCounts();
  } catch(e){ toast(esc(e.message)); }
}

async function likeBack(uid){
  try {
    var r = await _post({ action: 'like', uid: uid });
    if (!r.ok){ toast(esc(r.error)); return; }
    toast(r.mutual ? '💕 Match!' : '♥ Liked back');
  } catch(e){ toast(esc(e.message)); }
}

/* refresh the counts whenever the profile tab is drawn */
var _renderMe = renderMe;
renderMe = async function(){
  await _renderMe();
  loadNetworkCounts();
  loadReferCounts();
  translateDom();
};

/* keep the header money figure in step with the coin balance */
var _setCoins = setCoins;
setCoins = function(n){
  _setCoins(n);
  if (!MONEY) return;
  var cpu = Number(MONEY.coins_per_usd || 100);
  if (cpu < 1) cpu = 100;
  var local = (Number(n || 0) / cpu) * Number(MONEY.rate || 1);
  var pretty = local >= 1000 ? local.toLocaleString('en-US', { maximumFractionDigits: 0 })
                             : local.toLocaleString('en-US', { maximumFractionDigits: 2 });
  var pill = el('coinMoney');
  if (pill) pill.textContent = ' · ' + MONEY.currency + ' ' + pretty;
};

/* ---- money shown in the header pill ---- */
var MONEY = null;

async function refreshMoney(){
  try {
    var m = await _post({ action: 'money', currency: MYCUR });
    if (!m || !m.ok) return;
    MONEY = m;
    var n = el('coinMoney');
    if (n) n.textContent = ' · ' + m.currency + ' ' + m.pretty;
  } catch(e){}
}

/* ---- refer and earn ---- */
function copyText(txt, btn){
  var done = function(){
    toast(esc(T('refer_copied', 'Link copied')));
    if (btn){ btn.textContent = T('refer_copied', 'Copied'); setTimeout(function(){ if (btn) btn.textContent = T('refer_copy', 'Copy link'); }, 1800); }
  };
  try {
    navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); });
  } catch(e){
    try { fallbackCopy(txt); done(); } catch(e2){ toast(esc(txt)); }
  }
}
function fallbackCopy(txt){
  var ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.cssText = 'position:fixed;left:-2000px;top:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  if (ta.parentNode) ta.parentNode.removeChild(ta);
}

async function openRefer(){
  if (!ME || !ME.registered){ toast('Create your profile first.'); return; }
  openModal('<div class="spin"></div>');
  try {
    var r = await _post({ action: 'ref_info' });
    if (!r.ok){ closeModal(); toast(esc(r.error)); return; }
    var list = r.list || [];
    var rows = '';
    if (list.length){
      rows = '<div class="list">' + list.map(function(x){
        return '<div class="item"><div class="avatar">' + esc(initial(x.name)) + '</div>'
          + '<div class="txt"><div class="nm">' + esc(x.name) + '</div>'
          + '<div class="ms">' + when(x.joined) + '</div></div>'
          + (x.paid ? '<span class="badge g">paid</span>' : '<span class="badge a">waiting</span>')
          + '</div>';
      }).join('') + '</div>';
    } else {
      rows = '<p class="sub">' + esc(T('refer_none', 'You have not invited anyone yet.')) + '</p>';
    }
    var moneyLine = '';
    if (MONEY){
      var per = (r.bonus / (MONEY.coins_per_usd || 100)) * (MONEY.rate || 1);
      moneyLine = '<div class="sub" style="margin-top:6px">1 ' + esc(T('refer_bonus','bonus'))
        + ' = ' + money(r.bonus) + ' coins = ' + esc(MONEY.currency) + ' '
        + (per >= 1000 ? per.toLocaleString('en-US',{maximumFractionDigits:0})
                       : per.toLocaleString('en-US',{maximumFractionDigits:2}))
        + ' &middot; 100 coins = 1 USD</div>';
    }
    openModal('<div style="font-size:20px;font-weight:800;color:#6ee7b7">'
      + esc(T('refer_head', 'Invite friends and earn real money')) + '</div>'
      + '<p class="sub" style="margin:6px 0 12px">' + esc(T('refer_sub', 'Every friend who joins with your link and pays once gives you a bonus.')) + '</p>'
      + '<div class="row" style="margin-bottom:12px">'
      + '<div class="glass" style="padding:10px;text-align:center;flex:1"><div style="font-size:20px;font-weight:800">' + money(r.invited) + '</div><div class="sub">' + esc(T('refer_invited', 'People invited')) + '</div></div>'
      + '<div class="glass" style="padding:10px;text-align:center;flex:1"><div style="font-size:20px;font-weight:800;color:#6ee7b7">' + money(r.qualified) + '</div><div class="sub">' + esc(T('refer_qualified', 'Paid and counted')) + '</div></div>'
      + '<div class="glass" style="padding:10px;text-align:center;flex:1"><div style="font-size:20px;font-weight:800;color:#fcd34d">' + money(r.earned) + '</div><div class="sub">' + esc(T('refer_earned', 'Coins earned')) + '</div></div></div>'
      + '<div class="field"><label class="lbl">' + esc(T('refer_your_link', 'Your personal invite link')) + '</label>'
      + '<input id="refLink" readonly value="' + esc(r.link) + '" style="font-size:11.5px"></div>'
      + '<div class="row">'
      + '<button class="btn" onclick="copyText(\'' + esc(r.link) + '\', this)">' + esc(T('refer_copy', 'Copy link')) + '</button>'
      + '<button class="btn green" style="flex:none" onclick="shareRefer(\'' + esc(r.link) + '\')">' + esc(T('refer_share', 'Share')) + '</button>'
      + '</div>' + moneyLine
      + '<div class="h2" style="margin-top:16px">' + esc(T('refer_terms_title', 'Terms and conditions')) + '</div>'
      + '<div class="sub" style="line-height:1.7">'
      + '<b>1.</b> ' + esc(T('refer_t1', 'Share your link with friends.')) + '<br>'
      + '<b>2.</b> ' + esc(T('refer_t2', 'You earn the bonus only after that person signs up AND pays at least the minimum deposit.')) + '<br>'
      + '<b>3.</b> ' + esc(T('refer_t3', 'The bonus is paid once per person, never twice for the same friend.')) + '<br>'
      + '<b>4.</b> ' + esc(T('refer_t4', 'You may not invite yourself or use fake accounts.')) + '<br>'
      + '<b>5.</b> ' + esc(T('refer_t5', 'Bonus coins work like any other coins.')) + '<br>'
      + '<b>6.</b> ' + esc(T('refer_t6', 'Withdrawal follows the normal rules of the app.')) + '<br>'
      + '<b>7.</b> ' + esc(T('refer_t7', 'The bonus amount and minimum deposit can change.')) + '<br>'
      + '<b>8.</b> ' + esc(T('refer_t8', 'If a payment is refunded, the bonus is taken back.')) + '</div>'
      + '<div class="warn" style="margin-top:10px">' + esc(T('refer_rule', 'Minimum deposit to count: ')) + money(r.min_coins) + ' ' + esc(T('coins', 'coins'))
      + ' &middot; ' + esc(T('refer_bonus_each', 'Bonus each time')) + ': ' + money(r.bonus) + ' ' + esc(T('coins', 'coins')) + '</div>'
      + '<div class="h2" style="margin-top:16px">' + esc(T('refer_invited', 'People invited')) + '</div>' + rows);
    translateDom();
  } catch(e){ closeModal(); toast(esc(e.message)); }
}

function shareRefer(link){
  var txt = T('refer_share_text', 'Join me on HeartSync');
  try {
    if (window.Telegram && Telegram.WebApp && Telegram.WebApp.switchInlineQuery){
      Telegram.WebApp.switchInlineQuery(link, ['users', 'groups']);
      return;
    }
  } catch(e){}
  try {
    if (navigator.share){
      navigator.share({ title: 'HeartSync', text: txt, url: link });
      return;
    }
  } catch(e){}
  window.open('https://t.me/share/url?url=' + encodeURIComponent(link)
    + '&text=' + encodeURIComponent(txt), '_blank');
}

async function loadReferCounts(){
  var box = el('refCounts');
  if (!box) return;
  try {
    var r = await _post({ action: 'ref_info' });
    if (!r || !r.ok) return;
    box.innerHTML = esc(T('refer_invited', 'Invited')) + ': <b>' + r.invited + '</b> · '
      + esc(T('refer_qualified', 'Paid')) + ': <b>' + r.qualified + '</b> · '
      + esc(T('refer_earned', 'Earned')) + ': <b>' + money(r.earned) + '</b> '
      + esc(T('coins', 'coins'));
  } catch(e){}
}
